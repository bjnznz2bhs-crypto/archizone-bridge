        if (state.activePointers.has(e.pointerId)) {
          state.activePointers.set(e.pointerId, pt);
        }

        // === iPad専用ジェスチャー処理 ===
        if (state.deviceMode === 'ipad' && state.ipadGesture) {
          const g = state.ipadGesture;
          if (g.kind === 'pan' && state.ipadMode === 'pan') {
            const pts = Array.from(state.activePointers.values());
            const center = pts.length >= 2
              ? { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }
              : pts[0];
            if (center) {
              state.view.panX = g.origPanX + (center.x - g.startX);
              state.view.panY = g.origPanY + (center.y - g.startY);
              drawCanvas();
            }
            return;
          }
          if (g.kind === 'pinchZoom' && state.ipadMode === 'zoom') {
            const pts = Array.from(state.activePointers.values());
            if (pts.length >= 2) {
              const currDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
              const ratio = currDist / g.startDist;
              // 開始時ピンチ中心のみを基準に純粋ズーム（移動成分は完全無効）
              state.view = CadEngine.zoomAtScreenPoint(g.origView, g.anchorX, g.anchorY, g.origView.scale * ratio);
              syncZoomUI();
              drawCanvas();
            }
            return;
          }
          if (g.kind === 'dragZoom' && state.ipadMode === 'zoom') {
            // 上へドラッグ=拡大、下へドラッグ=縮小（画面中央基準でパン無し）
            const dy = g.startY - pt.y;
            const factor = Math.exp(dy * 0.008);
            state.view = CadEngine.zoomAtScreenPoint(g.origView, canvasW / 2, canvasH / 2, g.origView.scale * factor);
            syncZoomUI();
            drawCanvas();
            return;
          }
          return;
        }

        const rawWorld = screenToWorld(pt.x, pt.y);
        state.mouseCad = rawWorld;

        // === ドラッグ中の処理 ===
        if (state.drag) {
          if (state.drag.kind === 'pan') {
            state.view.panX = state.drag.origPanX + (pt.x - state.drag.startSx);
            state.view.panY = state.drag.origPanY + (pt.y - state.drag.startSy);
            drawCanvas();
            updateCoordReadout(pt);
            return;
          }

          if (state.drag.kind === 'rect') {
            let snapped = computeSnap(rawWorld);
            if (state.shiftDown) {
              const dx = snapped.x - state.drag.startWorld.x;
              const dy = snapped.y - state.drag.startWorld.y;
              const side = Math.max(Math.abs(dx), Math.abs(dy));
              snapped = {
                x: snapRoundMm(state.drag.startWorld.x + Math.sign(dx || 1) * side),
                y: snapRoundMm(state.drag.startWorld.y + Math.sign(dy || 1) * side),
                snapType: snapped.snapType
              };
            }
            state.drag.currWorld = snapped;
            state.snappedCad = snapped;
            drawCanvas();
            updateCoordReadout(pt);
            return;
          }

          if (state.drag.kind === 'moveVertex') {
            const excludeId = state.selection?.type === 'zone' ? state.selection.id : '__site__';
            const snapped = computeSnap(rawWorld, {
              excludeId,
              excludeVertexIdx: state.drag.index,
              angleAnchor: state.drag.origVertex
            });
            state.snappedCad = snapped;
            const pts = getSelectedVertices();
            if (pts) {
              pts[state.drag.index] = { x: snapped.x, y: snapped.y };
              state.drag.changed = true;
            }
            drawCanvas();
            updateCoordReadout(pt);
            return;
          }

          if (state.drag.kind === 'moveEdge') {
            const { i0, i1, nx, ny, startWorld, origPts } = state.drag;
            let offset = (rawWorld.x - startWorld.x) * nx + (rawWorld.y - startWorld.y) * ny;
            offset = state.snapGrid ? Math.round(offset / state.gridSpacing) * state.gridSpacing : snapRoundMm(offset);
            const pts = getSelectedVertices();
            if (pts) {
              pts[i0] = { x: roundMm(origPts[i0].x + nx * offset), y: roundMm(origPts[i0].y + ny * offset) };
              pts[i1] = { x: roundMm(origPts[i1].x + nx * offset), y: roundMm(origPts[i1].y + ny * offset) };
              state.drag.changed = true;
            }
            drawCanvas();
            updateCoordReadout(pt);
            return;
          }

          if (state.drag.kind === 'moveObject') {
            let dx = rawWorld.x - state.drag.startWorld.x;
            let dy = rawWorld.y - state.drag.startWorld.y;
            if (state.shiftDown) {
              if (Math.abs(dx) >= Math.abs(dy)) dy = 0; else dx = 0;
            }
            const excludeId = state.selection?.type === 'zone' ? state.selection.id : '__site__';
            const targetRef = { x: state.drag.refCorner.x + dx, y: state.drag.refCorner.y + dy };
            const snappedRef = computeSnap(targetRef, { excludeId });
            const snapDx = roundMm(snappedRef.x - state.drag.refCorner.x);
            const snapDy = roundMm(snappedRef.y - state.drag.refCorner.y);
            state.snappedCad = snappedRef;

            const pts = getSelectedVertices();
            if (pts) {
              for (let i = 0; i < pts.length; i++) {
                pts[i] = {
                  x: roundMm(state.drag.origPts[i].x + snapDx),
                  y: roundMm(state.drag.origPts[i].y + snapDy)
                };
              }
              if (Math.abs(snapDx) > 0.1 || Math.abs(snapDy) > 0.1) state.drag.changed = true;
            }
            drawCanvas();
            updateCoordReadout(pt);
            return;
          }
        }

        // ホバー＆スナップ更新
        const anchor = (state.tool === 'polygon' || state.tool === 'site') && state.polyDraft.length > 0
          ? state.polyDraft[state.polyDraft.length - 1] : null;
        state.snappedCad = computeSnap(rawWorld, { angleAnchor: anchor });

        if (state.deviceMode === 'ipad' && state.ipadMode !== 'edit') {
          canvasContainer.style.cursor = state.ipadMode === 'pan' ? 'grab' : 'ns-resize';
        } else if (state.spaceDown) {
          canvasContainer.style.cursor = 'grab';
        } else if (state.tool === 'select') {
          state.hoverHandle = hitTestHandles(pt.x, pt.y);
          canvasContainer.style.cursor = state.hoverHandle ? 'move' : 'default';
        } else {
          canvasContainer.style.cursor = 'crosshair';
        }

        drawCanvas();
        updateCoordReadout(pt);
      });

      function handlePointerEnd(e) {
        state.activePointers.delete(e.pointerId);
        if (state.activePointers.size === 0) {
          state.ipadGesture = null;
        } else if (state.deviceMode === 'ipad' && state.ipadMode === 'pan' && state.activePointers.size === 1) {
          // 2本指→1本指になった際に基準点をリセットしてジャンプを防止
          const rem = Array.from(state.activePointers.values())[0];
          state.ipadGesture = {
            kind: 'pan',
            startX: rem.x, startY: rem.y,
            origPanX: state.view.panX, origPanY: state.view.panY
          };
        } else if (state.deviceMode === 'ipad' && state.ipadMode === 'zoom') {
          state.ipadGesture = null;
        }

        if (!state.drag) return;
        const d = state.drag;
        state.drag = null;

        if (d.kind === 'pan') {
          canvasContainer.style.cursor = state.spaceDown ? 'grab' : 'default';
          return;
        }

        if (d.kind === 'rect') {
          const p0 = d.startWorld, p1 = d.currWorld;
          const minX = Math.min(p0.x, p1.x), maxX = Math.max(p0.x, p1.x);
          const minY = Math.min(p0.y, p1.y), maxY = Math.max(p0.y, p1.y);
          if (maxX - minX >= 100 && maxY - minY >= 100) {
            createNewZone([
              { x: minX, y: minY }, { x: maxX, y: minY },
              { x: maxX, y: maxY }, { x: minX, y: maxY }
            ]);
          } else {
            drawCanvas();
          }
          return;
        }

        if (d.changed) {
          if (state.selection?.type === 'zone') {
            const z = getSelectedZone();
            if (z) z.vertices = CadEngine.normalizeCCW(z.vertices);
          } else if (state.selection?.type === 'site') {
            state.siteBoundary = CadEngine.normalizeCCW(state.siteBoundary);
          }
          pushHistory();
          renderAll();
        }
      }

      canvas.addEventListener('pointerup', handlePointerEnd);
      canvas.addEventListener('pointercancel', handlePointerEnd);

      // ダブルクリック：ポリゴン完了 / 辺の中点に頂点追加
      canvas.addEventListener('dblclick', (e) => {
        if (state.deviceMode === 'ipad' && state.ipadMode !== 'edit') return;
        const pt = getCanvasPoint(e);
        if ((state.tool === 'polygon' || state.tool === 'site') && state.polyDraft.length >= 3) {
          finalizePolygonDraft();
          return;
        }
        if (state.tool === 'select') {
          const handle = hitTestHandles(pt.x, pt.y);
          const pts = getSelectedVertices();
          if (handle?.kind === 'edge' && pts) {
            const i0 = handle.index;
            const i1 = (i0 + 1) % pts.length;
            pts.splice(i0 + 1, 0, {
              x: roundMm((pts[i0].x + pts[i1].x) / 2),
              y: roundMm((pts[i0].y + pts[i1].y) / 2)
            });
            pushHistory();
            renderAll();
            showToast('辺の中点に頂点を追加しました', 'success');
          }
        }
      });

      function updateCoordReadout(pt) {
        const p = state.snappedCad || screenToWorld(pt.x, pt.y);
        document.getElementById('statusX').textContent = formatCoord(p.x, state.unit);
        document.getElementById('statusY').textContent = formatCoord(p.y, state.unit);
        document.getElementById('statusUnit').textContent = state.unit;
      }

      /* =========================================================================
       * 8. 自動検証テストスイート（7項目・実関数実行）
       * ========================================================================= */
      function runVerificationTests() {
        const results = [];
        const approxEq = (a, b, tol = 1e-3) => Math.abs(a - b) <= tol;

        // Test 1: 右手座標系・画面⇔CAD座標変換の往復精度
        try {
          const testView = { panX: 320, panY: 480, scale: 0.0625 };
          const samples = [
            { x: 0, y: 0 }, { x: 4550, y: 3640 },
            { x: -1820, y: -2730 }, { x: -910.5, y: 12345.25 }
          ];
          let maxErr = 0;
          for (const p of samples) {
            const s = CadEngine.cadToScreen(p.x, p.y, testView);
            const back = CadEngine.screenToCad(s.x, s.y, testView);
            maxErr = Math.max(maxErr, Math.hypot(back.x - p.x, back.y - p.y));
          }
          const s0 = CadEngine.cadToScreen(0, 0, testView);
          const sUp = CadEngine.cadToScreen(0, 1000, testView);
          const sRight = CadEngine.cadToScreen(1000, 0, testView);
          const isRightHanded = (sUp.y < s0.y) && (sRight.x > s0.x);
          const pass = maxErr < 0.001 && isRightHanded;
          results.push({
            id: 'T1',
            name: '右手座標系 & 画面⇔CAD往復変換精度',
            pass,
            expected: '最大誤差 < 0.001mm、+X=右 / +Y=上',
            actual: `最大誤差 ${maxErr.toExponential(2)}mm (+Y→Δsy=${(sUp.y - s0.y).toFixed(1)}px)`
          });
        } catch (err) {
          results.push({ id: 'T1', name: '右手座標系 & 画面⇔CAD往復変換精度', pass: false, expected: '例外なし', actual: err.message });
        }

        // Test 2: ズーム中心の座標不変性テスト
        try {
          const v0 = { panX: 210, panY: 540, scale: 0.05 };
          const cursor = { x: 642, y: 215 };
          const cadBefore = CadEngine.screenToCad(cursor.x, cursor.y, v0);
          const v1 = CadEngine.zoomAtScreenPoint(v0, cursor.x, cursor.y, 0.185);
          const v2 = CadEngine.zoomAtScreenPoint(v1, cursor.x, cursor.y, 0.023);
          const cadAfter1 = CadEngine.screenToCad(cursor.x, cursor.y, v1);
          const cadAfter2 = CadEngine.screenToCad(cursor.x, cursor.y, v2);
          const err1 = Math.hypot(cadAfter1.x - cadBefore.x, cadAfter1.y - cadBefore.y);
          const err2 = Math.hypot(cadAfter2.x - cadBefore.x, cadAfter2.y - cadBefore.y);
          const maxErr = Math.max(err1, err2);
          results.push({
            id: 'T2',
            name: 'ズーム中心のCAD座標不変性',
            pass: maxErr < 0.001,
            expected: '拡大・縮小後の基準点誤差 < 0.001mm',
            actual: `拡大誤差 ${err1.toExponential(2)}mm / 縮小誤差 ${err2.toExponential(2)}mm`
          });
        } catch (err) {
          results.push({ id: 'T2', name: 'ズーム中心のCAD座標不変性', pass: false, expected: '例外なし', actual: err.message });
        }

        // Test 3: ポリゴンCCW正規化 & 面積計算テスト（矩形4000×3000 + L字型）
        try {
          // 時計回り(CW)で矩形を入力
          const cwRect = [{ x: 0, y: 0 }, { x: 0, y: 3000 }, { x: 4000, y: 3000 }, { x: 4000, y: 0 }];
          const normRect = CadEngine.normalizeCCW(cwRect);
          const rectCCW = CadEngine.signedArea2(normRect) > 0;
          const rectAreaSqm = CadEngine.areaSqm(normRect);
          const rectTsubo = rectAreaSqm / TSUBO_SQM;

          // 時計回り(CW)でL字型ポリゴン (6000×4000 から右上 2000×2000 を欠く => 24 - 4 = 20.0㎡)
          const cwL = [
            { x: 0, y: 0 }, { x: 0, y: 4000 }, { x: 4000, y: 4000 },
            { x: 4000, y: 2000 }, { x: 6000, y: 2000 }, { x: 6000, y: 0 }
          ];
          const normL = CadEngine.normalizeCCW(cwL);
          const lCCW = CadEngine.signedArea2(normL) > 0;
          const lAreaSqm = CadEngine.areaSqm(normL);

          const pass = rectCCW && lCCW && approxEq(rectAreaSqm, 12.0, 1e-6) && approxEq(lAreaSqm, 20.0, 1e-6);
          results.push({
            id: 'T3',
            name: 'CCW自動正規化 & 面積計算（矩形・L字）',
            pass,
            expected: 'CCW=true, 矩形=12.00㎡, L字=20.00㎡',
            actual: `CCW=${rectCCW && lCCW}, 矩形=${rectAreaSqm.toFixed(2)}㎡(${rectTsubo.toFixed(2)}坪), L字=${lAreaSqm.toFixed(2)}㎡`
          });
        } catch (err) {
          results.push({ id: 'T3', name: 'CCW自動正規化 & 面積計算（矩形・L字）', pass: false, expected: '例外なし', actual: err.message });
        }

        // Test 4: 単位変換 (mm ⇔ m) 精度＆浮動小数点ゴミ混入チェック
        try {
          const testVals = [910, 1820, 3640, 6370, -2730, 455, 1234.5];
          let ratioOk = true;
          let cleanStrOk = true;
          const samplesOut = [];
          for (const mm of testVals) {
            const mVal = mmToUnit(mm, 'm');
            const backMm = unitToMm(mVal, 'm');
            if (!approxEq(mVal * 1000, mm, 1e-4) || !approxEq(backMm, mm, 1e-3)) ratioOk = false;
            const s = String(mVal);
            if (/00000|99999/.test(s)) cleanStrOk = false;
            if (mm === 3640) samplesOut.push(`3640mm→${s}m→${backMm}mm`);
          }
          results.push({
            id: 'T4',
            name: '単位変換 (mm ⇔ m) 精度・浮動小数点検証',
            pass: ratioOk && cleanStrOk,
            expected: '1000:1比率一致 & 小数ゴミなし',
            actual: `${samplesOut[0]} (全${testVals.length}値 検証${ratioOk && cleanStrOk ? 'OK' : 'NG'})`
          });
        } catch (err) {
          results.push({ id: 'T4', name: '単位変換 (mm ⇔ m) 精度・浮動小数点検証', pass: false, expected: '例外なし', actual: err.message });
        }

        // Test 5: 共有壁マージ (derivedWalls) 部分重複・T字接合テスト
        try {
          // 部屋A: (0,0)-(4000,4000) [周長16000]
          // 部屋B: (4000,1000)-(7000,5000) [周長14000] -> X=4000上で Y=1000..4000 (長さ3000) が共有壁
          // 期待値:
          // - 共有内壁(interior): 1本 (長さ3000, adjacent=['roomA','roomB'])
          // - 外壁(exterior): 部屋Aの残り(4000+4000+4000+1000=13000) + 部屋Bの残り(3000+4000+3000+1000=11000) = 24000
          // - 壁長合計: 27000mm (周長和30000 - 共有壁3000)
          const mockFloor = { id: 'f1', name: '1F', elevation: 0, height: 2800 };
          const mockZones = [
            {
              id: 'roomA', height: 2500,
              vertices: [{ x: 0, y: 0 }, { x: 4000, y: 0 }, { x: 4000, y: 4000 }, { x: 0, y: 4000 }]
            },
            {
              id: 'roomB', height: 2500,
              vertices: [{ x: 4000, y: 1000 }, { x: 7000, y: 1000 }, { x: 7000, y: 5000 }, { x: 4000, y: 5000 }]
            }
          ];
          const walls = CadEngine.computeDerivedWallsForFloor(mockFloor, mockZones);
          const interiors = walls.filter(w => w.type === 'interior');
          const exteriors = walls.filter(w => w.type === 'exterior');
          const intLen = interiors.reduce((s, w) => s + w.lengthMm, 0);
          const extLen = exteriors.reduce((s, w) => s + w.lengthMm, 0);
          const adjOk = interiors.length === 1 &&
            interiors[0].adjacentZoneIds.length === 2 &&
            interiors[0].adjacentZoneIds.includes('roomA') &&
            interiors[0].adjacentZoneIds.includes('roomB');
          const pass = adjOk && approxEq(intLen, 3000, 1) && approxEq(extLen, 24000, 1) && approxEq(intLen + extLen, 27000, 1);
          results.push({
            id: 'T5',
            name: '共有壁マージ (T字・部分重複分割)',
            pass,
            expected: '内壁1本(3000mm) + 外壁計24000mm = 計27000mm',
            actual: `内壁${interiors.length}本(${intLen}mm) + 外壁${exteriors.length}本(${extLen}mm) = 計${intLen + extLen}mm`
          });
        } catch (err) {
          results.push({ id: 'T5', name: '共有壁マージ (T字・部分重複分割)', pass: false, expected: '例外なし', actual: err.message });
        }

        // Test 6: JSONエクスポート→インポート往復完全一致テスト (mm & m 両モード)
        try {
          const currentModel = {
            projectName: state.projectName,
            floors: state.floors,
            siteBoundary: state.siteBoundary,
            zones: state.zones
          };
          let maxCoordDiffMm = 0;
          let attrMatch = true;
          for (const testUnit of ['mm', 'm']) {
            const exported = CadEngine.buildExportJson(currentModel, testUnit);
            const jsonStr = JSON.stringify(exported);
            const imported = CadEngine.parseImportJson(jsonStr);

            if (imported.floors.length !== currentModel.floors.length ||
                imported.zones.length !== currentModel.zones.length ||
                imported.siteBoundary.length !== currentModel.siteBoundary.length) {
              attrMatch = false;
            }
            for (const origZ of currentModel.zones) {
              const impZ = imported.zones.find(z => z.id === origZ.id);
              if (!impZ || impZ.name !== origZ.name || impZ.category !== origZ.category || !approxEq(impZ.height, origZ.height, 0.5)) {
                attrMatch = false;
                continue;
              }
              const origNorm = CadEngine.normalizeCCW(origZ.vertices);
              if (origNorm.length !== impZ.vertices.length) { attrMatch = false; continue; }
              for (let i = 0; i < origNorm.length; i++) {
                maxCoordDiffMm = Math.max(maxCoordDiffMm, Math.hypot(origNorm[i].x - impZ.vertices[i].x, origNorm[i].y - impZ.vertices[i].y));
              }
            }
          }
          const pass = attrMatch && maxCoordDiffMm < 0.1;
          results.push({
            id: 'T6',
            name: 'JSON出力→再インポート往復一致 (mm & m)',
            pass,
            expected: '全属性一致 & 最大頂点誤差 < 0.1mm',
            actual: `属性一致=${attrMatch}, 最大頂点誤差=${maxCoordDiffMm.toFixed(4)}mm`
          });
        } catch (err) {
          results.push({ id: 'T6', name: 'JSON出力→再インポート往復一致 (mm & m)', pass: false, expected: '例外なし', actual: err.message });
        }

        // Test 7: 現在の図面データ健全性チェック（自己交差・CCW・面積・建ぺい/容積率）
        try {
          const issues = [];
          for (const z of state.zones) {
            if (z.vertices.length < 3) issues.push(`${z.zoneNumber}: 頂点不足`);
            if (CadEngine.signedArea2(z.vertices) <= 0) issues.push(`${z.zoneNumber}: 非CCW`);
            if (CadEngine.areaSqm(z.vertices) <= 0) issues.push(`${z.zoneNumber}: 面積0`);
            if (CadEngine.hasSelfIntersection(z.vertices)) issues.push(`${z.zoneNumber}: 自己交差あり`);
          }
          if (state.siteBoundary.length >= 3) {
            if (CadEngine.signedArea2(state.siteBoundary) <= 0) issues.push('敷地: 非CCW');
            if (CadEngine.hasSelfIntersection(state.siteBoundary)) issues.push('敷地: 自己交差あり');
          }
          const exported = CadEngine.buildExportJson({
            projectName: state.projectName, floors: state.floors,
            siteBoundary: state.siteBoundary, zones: state.zones
          }, state.unit);
          const bcrOk = exported.site ? (exported.project.approxBCRPercent >= 0 && Number.isFinite(exported.project.approxBCRPercent)) : true;
          const farOk = exported.site ? (exported.project.approxFARPercent >= 0 && Number.isFinite(exported.project.approxFARPercent)) : true;
          if (!bcrOk || !farOk) issues.push('建ぺい率/容積率の計算異常');

          const pass = issues.length === 0;
          results.push({
            id: 'T7',
            name: '現在の図面データ健全性ライブ検証',
            pass,
            expected: '自己交差なし・全CCW・面積>0・法規指標正常',
            actual: pass
              ? `全${state.zones.length}ゾーン正常 / 建ぺい${exported.project.approxBCRPercent ?? '-'}%・容積${exported.project.approxFARPercent ?? '-'}%`
              : issues.join(', ')
          });
        } catch (err) {
          results.push({ id: 'T7', name: '現在の図面データ健全性ライブ検証', pass: false, expected: '例外なし', actual: err.message });
        }

        const passed = results.filter(r => r.pass).length;
        state.lastTestReport = { passed, total: results.length, results, timestamp: new Date() };
        renderTestResults();
        return state.lastTestReport;
      }

      function renderTestResults() {
        const rep = state.lastTestReport;
        if (!rep) return;
        const allPass = rep.passed === rep.total;
        const badgeText = `${rep.passed}/${rep.total}`;

        // トップバー＆タブバッジ更新
        const topDot = document.getElementById('topTestDot');
        const topBadge = document.getElementById('topTestBadge');
        const tabBadge = document.getElementById('tabTestCount');
        topDot.className = `w-2 h-2 rounded-full ${allPass ? 'bg-md-success' : 'bg-md-danger'}`;
        topBadge.textContent = badgeText;
        topBadge.className = `font-mono text-[10px] px-1.5 py-0.5 rounded-full font-semibold tabular-nums ${allPass ? 'bg-emerald-50 text-md-success' : 'bg-red-50 text-md-danger'}`;
        tabBadge.textContent = badgeText;
        tabBadge.className = `font-mono text-[10px] px-1.5 py-0.2 rounded-full ${allPass ? 'bg-emerald-50 text-md-success' : 'bg-red-50 text-md-danger'}`;

        const timeStr = rep.timestamp.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('testSummaryText').textContent = allPass
          ? `全 ${rep.total} 項目 PASS（最終実行 ${timeStr}）`
          : `${rep.total - rep.passed} 件の問題を検出（最終実行 ${timeStr}）`;

        const listEl = document.getElementById('testResultsList');
        listEl.innerHTML = rep.results.map(r => `
          <div class="border ${r.pass ? 'border-md-border bg-white' : 'border-red-200 bg-red-50/40'} rounded-xl p-2.5 space-y-1">
            <div class="flex items-center justify-between gap-2">
              <div class="font-semibold text-md-text text-[11.5px] flex items-center gap-1.5 min-w-0">
                <span class="font-mono text-[10px] text-md-muted shrink-0">${r.id}</span>
                <span class="truncate">${escapeHtml(r.name)}</span>
              </div>
              <span class="font-mono text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ${
                r.pass ? 'bg-emerald-50 text-md-success border border-emerald-200' : 'bg-red-50 text-md-danger border border-red-200'
              }">${r.pass ? 'PASS' : 'FAIL'}</span>
            </div>
            <div class="text-[10.5px] text-md-secondary leading-snug">
              <div><span class="text-md-muted">期待:</span> ${escapeHtml(r.expected)}</div>
              <div class="font-mono text-[10px] text-md-text mt-0.5 tabular-nums"><span class="font-sans text-md-muted">実測:</span> ${escapeHtml(r.actual)}</div>
            </div>
          </div>
        `).join('');
      }

      /* =========================================================================
       * 9. UIレンダリング（フロア・プロパティ・JSON・デバイスモード）
       * ========================================================================= */
      function renderAll() {
        renderFloorSegments();
        renderInspector();
        updateSelectionButtons();
        syncJsonPanel(true);
        drawCanvas();
        runVerificationTests();
      }

      function renderFloorSegments() {
        const sorted = [...state.floors].sort((a, b) => a.index - b.index);
        const container = document.getElementById('floorSegmentContainer');
        container.innerHTML = sorted.map(f => {
          const active = f.id === state.activeFloorId;
          return `
            <button data-floor-id="${f.id}" class="md-seg-btn ${active ? 'active' : ''} px-2.5 py-1 rounded-md text-xs font-semibold flex items-center gap-1 shrink-0">
              <span>${escapeHtml(f.name)}</span>
              <span class="text-[10px] font-mono opacity-65 tabular-nums">${state.zones.filter(z => z.floorId === f.id).length}</span>
            </button>
          `;
        }).join('');

        container.querySelectorAll('[data-floor-id]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeFloorId = btn.dataset.floorId;
            state.selection = null;
            state.selectedVertexIdx = -1;
            state.polyDraft = [];
            updateDrawingHint();
            renderAll();
          });
        });
      }

      function renderFloorPopover() {
        const listEl = document.getElementById('floorPopoverList');
        const u = state.unit;
        const stepAttr = u === 'm' ? '0.01' : '10';
        const sorted = [...state.floors].sort((a, b) => b.index - a.index);

        listEl.innerHTML = sorted.map(f => `
          <div class="bg-md-surface border border-md-border rounded-lg p-2 grid grid-cols-12 gap-1.5 items-end" data-fid="${f.id}">
            <div class="col-span-3">
              <label class="block text-[10px] text-md-secondary mb-0.5">フロア名</label>
              <input type="text" class="fp-name w-full bg-white border border-md-border rounded-md px-1.5 py-1 text-xs text-md-text" value="${escapeHtml(f.name)}" />
            </div>
            <div class="col-span-4">
              <label class="block text-[10px] text-md-secondary mb-0.5">基準EL (${u})</label>
              <input type="number" step="${stepAttr}" class="fp-elev w-full bg-white border border-md-border rounded-md px-1.5 py-1 font-mono text-xs text-right tabular-nums" value="${mmToUnit(f.elevation, u)}" />
            </div>
            <div class="col-span-4">
              <label class="block text-[10px] text-md-secondary mb-0.5">階高 (${u})</label>
              <input type="number" step="${stepAttr}" class="fp-height w-full bg-white border border-md-border rounded-md px-1.5 py-1 font-mono text-xs text-right tabular-nums" value="${mmToUnit(f.height, u)}" />
            </div>
            <div class="col-span-1 flex justify-end">
              <button class="fp-del w-6 h-7 rounded text-md-muted hover:text-md-danger hover:bg-red-50 disabled:opacity-25" ${state.floors.length <= 1 ? 'disabled' : ''} title="削除">✕</button>
            </div>
          </div>
        `).join('');

        listEl.querySelectorAll('[data-fid]').forEach(row => {
          const f = state.floors.find(item => item.id === row.dataset.fid);
          if (!f) return;
          row.querySelector('.fp-name').addEventListener('change', (e) => {
            f.name = e.target.value.trim() || f.name;
            pushHistory(); renderAll();
          });
          row.querySelector('.fp-elev').addEventListener('change', (e) => {
            f.elevation = unitToMm(e.target.value, state.unit);
            pushHistory(); renderAll();
          });
          row.querySelector('.fp-height').addEventListener('change', (e) => {
            const v = unitToMm(e.target.value, state.unit);
            if (v >= 1000) { f.height = v; pushHistory(); renderAll(); }
          });
          row.querySelector('.fp-del').addEventListener('click', () => {
            if (state.floors.length <= 1) return;
            state.floors = state.floors.filter(item => item.id !== f.id);
            state.zones = state.zones.filter(z => z.floorId !== f.id);
            if (state.activeFloorId === f.id) state.activeFloorId = state.floors[0].id;
            state.selection = null;
            pushHistory(); renderAll(); renderFloorPopover();
            showToast(`${f.name} を削除しました`);
          });
        });
      }

      function addNewFloor() {
        const sorted = [...state.floors].sort((a, b) => a.index - b.index);
        const top = sorted[sorted.length - 1];
        const nextIdx = top ? top.index + 1 : 0;
        const f = {
          id: uid('floor'),
          index: nextIdx,
          name: `${nextIdx + 1}F`,
          elevation: top ? top.elevation + top.height : 0,
          height: 2800
        };
        state.floors.push(f);
        state.activeFloorId = f.id;
        state.selection = null;
        pushHistory();
        renderAll();
        showToast(`${f.name} を追加しました`, 'success');
      }

      function updateSelectionButtons() {
        document.getElementById('btnDuplicate').disabled = state.selection?.type !== 'zone';
        document.getElementById('btnDelete').disabled = !state.selection;
      }

      function updateDrawingHint() {
        const pill = document.getElementById('drawingHintPill');
        const finBtn = document.getElementById('btnFinishPolyHint');
        if (state.tool === 'polygon' || state.tool === 'site') {
          pill.classList.remove('hidden');
          const label = state.tool === 'site' ? '敷地境界作図' : 'ポリゴン作図';
          document.getElementById('drawingHintText').textContent =
            `${label} (${state.polyDraft.length}点) — クリックで頂点追加 / 始点クリック・Enterで閉じる`;
          finBtn.classList.toggle('hidden', state.polyDraft.length < 3);
        } else if (state.tool === 'rect') {
          pill.classList.remove('hidden');
          document.getElementById('drawingHintText').textContent = '矩形ゾーン作図 — ドラッグで領域を作成（Shiftで正方形）';
          finBtn.classList.add('hidden');
        } else {
          pill.classList.add('hidden');
        }
      }

      function renderInspector() {
        const panel = document.getElementById('tabPanelProps');
        const u = state.unit;
        const stepAttr = u === 'm' ? '0.001' : '1';

        // === ゾーン選択時 ===
        if (state.selection?.type === 'zone') {
          const z = getSelectedZone();
          if (!z) { state.selection = null; renderInspector(); return; }
          const cat = ZONE_CATEGORIES[z.category] || ZONE_CATEGORIES.Other;
          const area = CadEngine.areaSqm(z.vertices);
          const tsubo = area / TSUBO_SQM;
          const perim = CadEngine.perimeterMm(z.vertices) / 1000;
          const isRect = CadEngine.isAxisAlignedRect(z.vertices);
          const bb = CadEngine.boundingBox(z.vertices);

          const catOpts = Object.entries(ZONE_CATEGORIES).map(([k, v]) =>
            `<option value="${k}" ${z.category === k ? 'selected' : ''}>${v.label} (${k})</option>`
          ).join('');

          const vertRows = z.vertices.map((v, idx) => `
            <tr class="border-b border-md-border/70 ${state.selectedVertexIdx === idx ? 'bg-md-primaryContainer/50' : ''}">
              <td class="py-1 px-1.5 font-mono text-[10px] text-md-secondary">#${idx + 1}</td>
              <td class="py-1 px-1">
                <input type="number" step="${stepAttr}" data-v-idx="${idx}" data-axis="x" value="${mmToUnit(v.x, u)}"
                  class="vert-inp w-full bg-white border border-md-border rounded-md px-1.5 py-0.5 font-mono text-[11px] text-right tabular-nums focus:outline-none focus:border-md-primary" />
              </td>
              <td class="py-1 px-1">
                <input type="number" step="${stepAttr}" data-v-idx="${idx}" data-axis="y" value="${mmToUnit(v.y, u)}"
                  class="vert-inp w-full bg-white border border-md-border rounded-md px-1.5 py-0.5 font-mono text-[11px] text-right tabular-nums focus:outline-none focus:border-md-primary" />
              </td>
              <td class="py-1 px-1 text-right whitespace-nowrap">
                <button data-v-add="${idx}" class="px-1 text-md-primary hover:bg-md-primaryContainer rounded" title="次の辺の中点に頂点追加">+</button>
                <button data-v-del="${idx}" ${z.vertices.length <= 3 ? 'disabled' : ''} class="px-1 text-md-muted hover:text-md-danger hover:bg-red-50 rounded disabled:opacity-25" title="頂点削除">✕</button>
              </td>
            </tr>
          `).join('');

          panel.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-sm border" style="background:${cat.fill}; border-color:${cat.stroke};"></span>
                <span class="font-semibold text-md-text">ゾーンプロパティ</span>
              </div>
              <button id="btnClearSel" class="text-[11px] text-md-primary hover:underline">概要へ戻る</button>
            </div>

            <div class="grid grid-cols-3 gap-1.5 bg-md-surface border border-md-border rounded-xl p-2.5 text-center tabular-nums">
              <div><div class="text-[10px] text-md-secondary">面積</div><div class="font-mono font-semibold text-md-text text-xs mt-0.5">${area.toFixed(2)}㎡</div></div>
              <div class="border-x border-md-border"><div class="text-[10px] text-md-secondary">坪数</div><div class="font-mono font-semibold text-md-text text-xs mt-0.5">${tsubo.toFixed(2)}坪</div></div>
              <div><div class="text-[10px] text-md-secondary">周長</div><div class="font-mono font-semibold text-md-text text-xs mt-0.5">${perim.toFixed(2)}m</div></div>
            </div>

            <div class="space-y-2.5 border border-md-border rounded-xl p-3 bg-white">
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="block text-[10px] text-md-secondary mb-1">ゾーン番号</label>
                  <input id="inpZoneNum" type="text" value="${escapeHtml(z.zoneNumber)}" class="w-full bg-md-surface focus:bg-white border border-md-border rounded-lg px-2 py-1.5 font-mono text-xs focus:outline-none focus:border-md-primary" />
                </div>
                <div class="col-span-2">
                  <label class="block text-[10px] text-md-secondary mb-1">ゾーン名称</label>
                  <input id="inpZoneName" type="text" value="${escapeHtml(z.name)}" class="w-full bg-md-surface focus:bg-white border border-md-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-md-primary" />
                </div>
              </div>

              <div>
                <label class="block text-[10px] text-md-secondary mb-1">カテゴリ（配色）</label>
                <select id="inpZoneCat" class="w-full bg-md-surface focus:bg-white border border-md-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-md-primary">${catOpts}</select>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-md-secondary mb-1">天井高 (${u})</label>
                  <input id="inpZoneH" type="number" step="${stepAttr}" value="${mmToUnit(z.height, u)}" class="w-full bg-md-surface focus:bg-white border border-md-border rounded-lg px-2 py-1.5 font-mono text-xs text-right tabular-nums focus:outline-none focus:border-md-primary" />
                </div>
                <div>
                  <label class="block text-[10px] text-md-secondary mb-1">床オフセット (${u})</label>
                  <input id="inpZoneOff" type="number" step="${stepAttr}" value="${mmToUnit(z.baseOffset || 0, u)}" class="w-full bg-md-surface focus:bg-white border border-md-border rounded-lg px-2 py-1.5 font-mono text-xs text-right tabular-nums focus:outline-none focus:border-md-primary" />
                </div>
              </div>

              <div>
                <label class="block text-[10px] text-md-secondary mb-1">AI指示メモ (aiNotes)</label>
                <textarea id="inpAiNotes" rows="2" placeholder="開口部・建具・構造・仕上げの指示を記入" class="w-full bg-md-surface focus:bg-white border border-md-border rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-md-primary resize-none">${escapeHtml(z.aiNotes || '')}</textarea>
              </div>
            </div>

            ${isRect ? `
            <div class="border border-md-border rounded-xl p-3 bg-md-surface/60 space-y-2">
              <div class="text-[11px] font-semibold text-md-text">矩形ダイレクト寸法 (${u})</div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-md-secondary mb-0.5">原点 X</label>
                  <input id="rectX" type="number" step="${stepAttr}" value="${mmToUnit(bb.minX, u)}" class="rect-inp w-full bg-white border border-md-border rounded-lg px-2 py-1 font-mono text-xs text-right tabular-nums focus:outline-none focus:border-md-primary" />
                </div>
                <div>
                  <label class="block text-[10px] text-md-secondary mb-0.5">原点 Y</label>
                  <input id="rectY" type="number" step="${stepAttr}" value="${mmToUnit(bb.minY, u)}" class="rect-inp w-full bg-white border border-md-border rounded-lg px-2 py-1 font-mono text-xs text-right tabular-nums focus:outline-none focus:border-md-primary" />
                </div>
                <div>
                  <label class="block text-[10px] text-md-secondary mb-0.5">幅 W</label>
                  <input id="rectW" type="number" step="${stepAttr}" value="${mmToUnit(bb.width, u)}" class="rect-inp w-full bg-white border border-md-border rounded-lg px-2 py-1 font-mono text-xs text-right tabular-nums focus:outline-none focus:border-md-primary" />
                </div>
                <div>
                  <label class="block text-[10px] text-md-secondary mb-0.5">奥行 D</label>
                  <input id="rectD" type="number" step="${stepAttr}" value="${mmToUnit(bb.depth, u)}" class="rect-inp w-full bg-white border border-md-border rounded-lg px-2 py-1 font-mono text-xs text-right tabular-nums focus:outline-none focus:border-md-primary" />
                </div>
              </div>
            </div>` : ''}

            <div class="border border-md-border rounded-xl p-3 bg-white space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-semibold text-md-text">頂点座標テーブル (CCW / ${u})</span>
                <span class="text-[10px] font-mono text-md-muted">${z.vertices.length}点</span>
              </div>
              <table class="w-full border-collapse">
                <thead>
                  <tr class="text-[10px] text-md-secondary border-b border-md-border">
                    <th class="text-left py-1 px-1.5 w-7">#</th>
                    <th class="text-right py-1 px-1">X</th>
                    <th class="text-right py-1 px-1">Y</th>
                    <th class="text-right py-1 px-1 w-11"></th>
                  </tr>
                </thead>
                <tbody>${vertRows}</tbody>
              </table>
            </div>
          `;

          bindZoneInspector(z);
          return;
        }

        // === 敷地境界選択時 ===
        if (state.selection?.type === 'site' && state.siteBoundary.length >= 3) {
          const area = CadEngine.areaSqm(state.siteBoundary);
          const rows = state.siteBoundary.map((v, idx) => `
            <tr class="border-b border-md-border/70">
              <td class="py-1 px-1.5 font-mono text-[10px] text-md-secondary">#${idx + 1}</td>
              <td class="py-1 px-1"><input type="number" step="${stepAttr}" data-v-idx="${idx}" data-axis="x" value="${mmToUnit(v.x, u)}" class="site-inp w-full bg-white border border-md-border rounded-md px-1.5 py-0.5 font-mono text-[11px] text-right tabular-nums" /></td>
              <td class="py-1 px-1"><input type="number" step="${stepAttr}" data-v-idx="${idx}" data-axis="y" value="${mmToUnit(v.y, u)}" class="site-inp w-full bg-white border border-md-border rounded-md px-1.5 py-0.5 font-mono text-[11px] text-right tabular-nums" /></td>
              <td class="py-1 px-1 text-right">
                <button data-s-del="${idx}" ${state.siteBoundary.length <= 3 ? 'disabled' : ''} class="px-1 text-md-muted hover:text-md-danger disabled:opacity-25">✕</button>
              </td>
            </tr>
          `).join('');

          panel.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-semibold text-md-text">敷地境界 (site)</span>
              <button id="btnClearSel" class="text-[11px] text-md-primary hover:underline">概要へ戻る</button>
            </div>
            <div class="bg-md-surface border border-md-border rounded-xl p-3 flex items-center justify-between tabular-nums">
              <div>
                <div class="text-[10px] text-md-secondary">敷地面積</div>
                <div class="font-mono font-semibold text-sm text-md-text">${area.toFixed(2)}㎡ <span class="text-xs text-md-secondary">(${(area / TSUBO_SQM).toFixed(2)}坪)</span></div>
              </div>
              <button id="btnDelSite" class="px-2.5 py-1 rounded-lg border border-red-200 text-md-danger hover:bg-red-50 text-[11px] font-medium">削除</button>
            </div>
            <div class="border border-md-border rounded-xl p-3">
              <div class="text-[11px] font-semibold text-md-text mb-1.5">敷地頂点座標 (CCW / ${u})</div>
              <table class="w-full border-collapse">
                <thead><tr class="text-[10px] text-md-secondary border-b border-md-border"><th class="text-left py-1 px-1.5">#</th><th class="text-right py-1 px-1">X</th><th class="text-right py-1 px-1">Y</th><th></th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          `;

          document.getElementById('btnClearSel').addEventListener('click', clearSelection);
          document.getElementById('btnDelSite').addEventListener('click', deleteSelected);
          panel.querySelectorAll('.site-inp').forEach(inp => {
            inp.addEventListener('change', () => {
              const i = Number(inp.dataset.vIdx);
              state.siteBoundary[i][inp.dataset.axis] = unitToMm(inp.value, state.unit);
              state.siteBoundary = CadEngine.normalizeCCW(state.siteBoundary);
              pushHistory(); renderAll();
            });
          });
          panel.querySelectorAll('[data-s-del]').forEach(btn => {
            btn.addEventListener('click', () => {
              if (state.siteBoundary.length <= 3) return;
              state.siteBoundary.splice(Number(btn.dataset.sDel), 1);
              pushHistory(); renderAll();
            });
          });
          return;
        }

        // === 未選択時：プロジェクト概要＆現階ゾーン一覧 ===
        const active = getActiveFloor();
        const sortedFloors = [...state.floors].sort((a, b) => a.index - b.index);
        const siteArea = state.siteBoundary.length >= 3 ? CadEngine.areaSqm(state.siteBoundary) : 0;
        const firstFloor = sortedFloors[0];
        const footprint = firstFloor
          ? state.zones.filter(z => z.floorId === firstFloor.id && z.category !== 'Exterior').reduce((s, z) => s + CadEngine.areaSqm(z.vertices), 0)
          : 0;
        const totalIndoor = state.zones.filter(z => z.category !== 'Exterior').reduce((s, z) => s + CadEngine.areaSqm(z.vertices), 0);
        const bcr = siteArea > 0 ? `${((footprint / siteArea) * 100).toFixed(1)}%` : '—';
        const far = siteArea > 0 ? `${((totalIndoor / siteArea) * 100).toFixed(1)}%` : '—';

        const floorZones = state.zones.filter(z => z.floorId === active?.id);
        const zoneCards = floorZones.length === 0
          ? `<div class="text-center py-6 text-md-muted text-xs bg-md-surface rounded-xl border border-dashed border-md-border">この階にゾーンがありません。<br/>左ツールの矩形(R)またはポリゴン(P)で作図できます。</div>`
          : floorZones.map(z => {
              const cat = ZONE_CATEGORIES[z.category] || ZONE_CATEGORIES.Other;
              const a = CadEngine.areaSqm(z.vertices);
              return `
                <button data-sel-zone="${z.id}" class="w-full text-left px-3 py-2 rounded-xl border border-md-border bg-white hover:bg-md-surface hover:border-gray-300 flex items-center justify-between gap-2 transition-colors">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="w-2.5 h-2.5 rounded-sm border shrink-0" style="background:${cat.fill}; border-color:${cat.stroke};"></span>
                    <div class="truncate">
                      <span class="font-mono text-[10px] text-md-muted mr-1">${escapeHtml(z.zoneNumber)}</span>
                      <span class="font-medium text-md-text">${escapeHtml(z.name)}</span>
                    </div>
                  </div>
                  <span class="font-mono text-[11px] text-md-secondary tabular-nums shrink-0">${a.toFixed(1)}㎡</span>
                </button>
              `;
            }).join('');

        panel.innerHTML = `
          <div class="space-y-1.5">
            <label class="block text-[11px] font-medium text-md-secondary">プロジェクト名</label>
            <input id="inpProjName" type="text" value="${escapeHtml(state.projectName)}" class="w-full bg-md-surface focus:bg-white border border-md-border rounded-lg px-2.5 py-1.5 text-xs text-md-text focus:outline-none focus:border-md-primary" />
          </div>

          <!-- 建築面積・延床面積・法規概算カード -->
          <div class="bg-md-surface border border-md-border rounded-xl p-3 space-y-2.5 tabular-nums">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-semibold text-md-text">プロジェクト面積サマリー</span>
              ${siteArea > 0 ? '<button id="btnSelectSiteOverview" class="text-[11px] text-md-primary hover:underline">敷地編集</button>' : ''}
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-white border border-md-border rounded-lg p-2">
                <div class="text-[10px] text-md-secondary">敷地面積</div>
                <div class="font-mono font-semibold text-md-text mt-0.5">${siteArea > 0 ? siteArea.toFixed(1) + '㎡' : '未設定'}</div>
              </div>
              <div class="bg-white border border-md-border rounded-lg p-2">
                <div class="text-[10px] text-md-secondary">建築面積 (1F)</div>
                <div class="font-mono font-semibold text-md-text mt-0.5">${footprint.toFixed(1)}㎡</div>
              </div>
              <div class="bg-white border border-md-border rounded-lg p-2">
                <div class="text-[10px] text-md-secondary">延床面積</div>
                <div class="font-mono font-semibold text-md-primary mt-0.5">${totalIndoor.toFixed(1)}㎡ <span class="text-[10px] text-md-muted">(${(totalIndoor / TSUBO_SQM).toFixed(1)}坪)</span></div>
              </div>
              <div class="bg-white border border-md-border rounded-lg p-2">
                <div class="text-[10px] text-md-secondary">概算 建ぺい / 容積</div>
                <div class="font-mono font-semibold text-md-text mt-0.5">${bcr} / ${far}</div>
              </div>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-semibold text-md-text">${escapeHtml(active?.name || '')} のゾーン一覧 (${floorZones.length})</span>
              <span class="text-[10px] font-mono text-md-muted">EL ${formatLen(active?.elevation || 0, u)}</span>
            </div>
            <div class="space-y-1.5">${zoneCards}</div>
          </div>
        `;

        document.getElementById('inpProjName').addEventListener('change', (e) => {
          state.projectName = e.target.value;
          pushHistory(); syncJsonPanel(true);
        });
        const selSiteBtn = document.getElementById('btnSelectSiteOverview');
        if (selSiteBtn) {
          selSiteBtn.addEventListener('click', () => {
            state.selection = { type: 'site' };
            setTool('select');
            renderInspector(); updateSelectionButtons(); drawCanvas();
          });
        }
        panel.querySelectorAll('[data-sel-zone]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selection = { type: 'zone', id: btn.dataset.selZone };
            state.selectedVertexIdx = -1;
            setTool('select');
            renderInspector(); updateSelectionButtons(); drawCanvas();
          });
        });
      }

      function bindZoneInspector(z) {
        const panel = document.getElementById('tabPanelProps');
        document.getElementById('btnClearSel').addEventListener('click', clearSelection);

        const commit = () => { pushHistory(); drawCanvas(); syncJsonPanel(true); runVerificationTests(); };
        document.getElementById('inpZoneNum').addEventListener('input', (e) => { z.zoneNumber = e.target.value; drawCanvas(); });
        document.getElementById('inpZoneNum').addEventListener('change', commit);
        document.getElementById('inpZoneName').addEventListener('input', (e) => { z.name = e.target.value; drawCanvas(); });
        document.getElementById('inpZoneName').addEventListener('change', commit);
        document.getElementById('inpZoneCat').addEventListener('change', (e) => { z.category = e.target.value; pushHistory(); renderAll(); });
        document.getElementById('inpZoneH').addEventListener('change', (e) => {
          const v = unitToMm(e.target.value, state.unit);
          if (v >= 300) { z.height = v; commit(); }
        });
        document.getElementById('inpZoneOff').addEventListener('change', (e) => {
          z.baseOffset = unitToMm(e.target.value, state.unit);
          commit();
        });
        document.getElementById('inpAiNotes').addEventListener('input', (e) => { z.aiNotes = e.target.value; drawCanvas(); });
        document.getElementById('inpAiNotes').addEventListener('change', commit);

        // 矩形ダイレクト編集
        if (document.getElementById('rectX')) {
          const applyRect = () => {
            const x = unitToMm(document.getElementById('rectX').value, state.unit);
            const y = unitToMm(document.getElementById('rectY').value, state.unit);
            const w = unitToMm(document.getElementById('rectW').value, state.unit);
            const d = unitToMm(document.getElementById('rectD').value, state.unit);
            if (w < 50 || d < 50) return;
            z.vertices = [
              { x, y }, { x: roundMm(x + w), y },
              { x: roundMm(x + w), y: roundMm(y + d) }, { x, y: roundMm(y + d) }
            ];
            pushHistory(); renderAll();
          };
          panel.querySelectorAll('.rect-inp').forEach(inp => inp.addEventListener('change', applyRect));
        }

        // 頂点テーブル編集
        panel.querySelectorAll('.vert-inp').forEach(inp => {
          inp.addEventListener('change', () => {
            const idx = Number(inp.dataset.vIdx);
            z.vertices[idx][inp.dataset.axis] = unitToMm(inp.value, state.unit);
            z.vertices = CadEngine.normalizeCCW(z.vertices);
            pushHistory(); renderAll();
          });
        });
        panel.querySelectorAll('[data-v-add]').forEach(btn => {
          btn.addEventListener('click', () => {
            const i = Number(btn.dataset.vAdd);
            const a = z.vertices[i], b = z.vertices[(i + 1) % z.vertices.length];
            z.vertices.splice(i + 1, 0, { x: roundMm((a.x + b.x) / 2), y: roundMm((a.y + b.y) / 2) });
            pushHistory(); renderAll();
          });
        });
        panel.querySelectorAll('[data-v-del]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (z.vertices.length <= 3) return;
            z.vertices.splice(Number(btn.dataset.vDel), 1);
            z.vertices = CadEngine.normalizeCCW(z.vertices);
            state.selectedVertexIdx = -1;
            pushHistory(); renderAll();
          });
        });
      }

      function clearSelection() {
        state.selection = null;
        state.selectedVertexIdx = -1;
        renderInspector();
        updateSelectionButtons();
        drawCanvas();
      }

      function syncJsonPanel(force = false) {
        const editor = document.getElementById('jsonEditor');
        const payload = CadEngine.buildExportJson({
          projectName: state.projectName,
          floors: state.floors,
          siteBoundary: state.siteBoundary,
          zones: state.zones
        }, state.unit);

        const wallCount = payload.floors.reduce((acc, f) => acc + f.derivedWalls.length, 0);
        document.getElementById('derivedWallBadge').textContent = `${wallCount} 壁`;

        if (!force && state.jsonDirty && document.activeElement === editor) return;
        editor.value = JSON.stringify(payload, null, 2);
        state.jsonDirty = false;
        const badge = document.getElementById('jsonSyncBadge');
        badge.textContent = '同期済み';
        badge.className = 'text-[10px] font-mono text-md-success';
        document.getElementById('jsonErrorBox').classList.add('hidden');
      }

      function buildAiPromptText() {
        const payload = CadEngine.buildExportJson({
          projectName: state.projectName,
          floors: state.floors,
          siteBoundary: state.siteBoundary,
          zones: state.zones
        }, state.unit);
        const unitDesc = state.unit === 'm' ? 'm（メートル / Archicad API標準）' : 'mm（ミリメートル）';
        return [
          '以下の建築ゾーニング中間JSONに従って、Archicad（Python API / Tapir / MCP等）で正確なフロア・敷地境界・ゾーン・壁・スラブを生成してください。',
          '',
          '【仕様】',
          `- 座標系: 右手座標系（+X右 / +Y上）、ポリゴン頂点は反時計回り（CCW）正規化済み`,
          `- 単位: ${unitDesc}`,
          `- floors[].derivedWalls に共有境界を分割マージ済みの外壁(exterior)・内壁(interior)の始点/終点座標と隣接ゾーンIDが含まれています。壁生成の基準線として利用してください。`,
          `- 各ゾーンの aiNotes に記載された設計要件（開口部・建具・段差・防音等）をモデリングに反映してください。`,
          '',
          '```json',
          JSON.stringify(payload, null, 2),
          '```'
        ].join('\n');
      }

      function duplicateSelected() {
        const z = getSelectedZone();
        if (!z) return;
        const copy = {
          ...z,
          id: uid('zone'),
          zoneNumber: nextZoneNumber(),
          name: `${z.name} (複製)`,
          vertices: z.vertices.map(v => ({ x: roundMm(v.x + state.gridSpacing), y: roundMm(v.y - state.gridSpacing) }))
        };
        state.zones.push(copy);
        state.selection = { type: 'zone', id: copy.id };
        state.selectedVertexIdx = -1;
        pushHistory();
        renderAll();
        showToast(`${copy.zoneNumber} を複製しました`, 'success');
      }

      function deleteSelected() {
        if (!state.selection) return;
        // 頂点が選択されている場合は頂点のみ削除（3点以下は不可）
        if (state.selectedVertexIdx >= 0) {
          const pts = getSelectedVertices();
          if (pts && pts.length > 3) {
            pts.splice(state.selectedVertexIdx, 1);
            if (state.selection.type === 'zone') {
              const z = getSelectedZone();
              z.vertices = CadEngine.normalizeCCW(z.vertices);
            } else {
              state.siteBoundary = CadEngine.normalizeCCW(state.siteBoundary);
            }
            state.selectedVertexIdx = -1;
            pushHistory();
            renderAll();
            showToast('選択した頂点を削除しました');
            return;
          } else {
            showToast('ポリゴンは3頂点未満にできません', 'error');
            return;
          }
        }

        if (state.selection.type === 'zone') {
          const z = getSelectedZone();
          state.zones = state.zones.filter(item => item.id !== state.selection.id);
          state.selection = null;
          pushHistory();
          renderAll();
          showToast(`${z?.zoneNumber || 'ゾーン'} を削除しました`);
        } else if (state.selection.type === 'site') {
          state.siteBoundary = [];
          state.selection = null;
          pushHistory();
          renderAll();
          showToast('敷地境界を削除しました');
        }
      }

            applyImportedJson(text);
          };

        document.getElementById('ipadZoomOutBtn').addEventListener('click', () => {

          syncZoomUI(); drawCanvas();
        });
        document.getElementById('ipadZoomSlider').addEventListener('input', (e) => {
          const val = Number(e.target.value);
          const targetScale = 0.055 * Math.pow(2, val / 55);
          state.view = CadEngine.zoomAtScreenPoint(state.view, canvasW / 2, canvasH / 2, targetScale);
          syncZoomUI(); drawCanvas();
        });

        // キーボードショートカット
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Shift') state.shiftDown = true;
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

          if (e.code === 'Space') {
            e.preventDefault();
            state.spaceDown = true;
            if (state.deviceMode === 'pc') canvasContainer.style.cursor = 'grab';
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) redo(); else undo();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
            e.preventDefault(); redo(); return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
            e.preventDefault(); duplicateSelected(); return;
          }

          const k = e.key.toLowerCase();
          if (k === 'v') setTool('select');
          else if (k === 'r') setTool('rect');
          else if (k === 'p') setTool('polygon');
          else if (k === 's') setTool('site');
          else if (k === 'f') fitView();
          else if (k === 'g') { state.snapGrid = !state.snapGrid; document.getElementById('chkSnapGrid').checked = state.snapGrid; drawCanvas(); }
          else if (k === 'm') { state.snapVertex = !state.snapVertex; document.getElementById('chkSnapVertex').checked = state.snapVertex; drawCanvas(); }
          else if (k === 'o') { state.onionSkin = !state.onionSkin; document.getElementById('chkOnionSkin').checked = state.onionSkin; drawCanvas(); }
          else if (e.key === 'Enter' && (state.tool === 'polygon' || state.tool === 'site')) {
            e.preventDefault(); finalizePolygonDraft();
          } else if (e.key === 'Escape') {
            if (state.polyDraft.length > 0) { state.polyDraft = []; updateDrawingHint(); drawCanvas(); }
            else { clearSelection(); setTool('select'); }
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            if ((state.tool === 'polygon' || state.tool === 'site') && state.polyDraft.length > 0) {
              state.polyDraft.pop(); updateDrawingHint(); drawCanvas();
            } else if (state.selection) {
              e.preventDefault(); deleteSelected();
            }
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.key === 'Shift') state.shiftDown = false;
          if (e.code === 'Space') {
            state.spaceDown = false;
            if (state.deviceMode === 'pc') {
              canvasContainer.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
            }
          }
        });
      }

      /* =========================================================================
       * 11. 共有JSON適用 & 初期化
       * ========================================================================= */
      function modelSignature(m) {
        return JSON.stringify({
          projectName: m.projectName,
          floors: m.floors,
          siteBoundary: m.siteBoundary,
          zones: m.zones
        });
      }

      function loadModelIntoState(model, unit) {
        state.projectName = model.projectName;
        state.floors = model.floors;
        state.siteBoundary = model.siteBoundary;
        state.zones = model.zones;
        state.activeFloorId = model.floors[0]?.id || null;
        state.selection = null;
        state.selectedVertexIdx = -1;
        if (unit) {
          state.unit = unit === 'm' ? 'm' : 'mm';
          document.getElementById('unitMmBtn').classList.toggle('active', state.unit === 'mm');
          document.getElementById('unitMBtn').classList.toggle('active', state.unit === 'm');
          document.getElementById('statusUnit').textContent = state.unit;
        }
      }

      function applyImportedJson(rawText, opts = {}) {
        const errBox = document.getElementById('jsonErrorBox');
        errBox.classList.add('hidden');
        try {
          const beforeSig = modelSignature(state);
          const parsed = CadEngine.parseImportJson(rawText);
          const afterSig = modelSignature(parsed);
          const isSameModel = beforeSig === afterSig && state.unit === parsed.unit;

          if (isSameModel && !opts.fromUrl && !opts.isInit) {
            syncJsonPanel(true);
            showToast('現在の図面と同じ内容です（別のJSONを貼り付けて再構築してください）', 'info');
            return false;
          }

          loadModelIntoState(parsed, parsed.unit);
          pushHistory();
          renderAll();
          fitView();
          if (!opts.fromUrl && !opts.isInit) {
            if (window.innerWidth < 640) setDrawerOpen(false);
            else setRightTab('props');
          }
          showToast(
            opts.fromUrl
              ? `共有リンクから図面を読み込みました (${parsed.floors.length}階 / ${parsed.zones.length}ゾーン)`
              : `図面を再構築しました: ${parsed.projectName} (${parsed.floors.length}階 / ${parsed.zones.length}ゾーン)`,
            'success'
          );
          return true;
        } catch (err) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
          errBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          showToast(err.message, 'error');
          return false;
        }
      }

      function decodeHashJson() {
        const h = window.location.hash || '';
        if (!h.startsWith('#data=')) return null;
        let b64 = h.slice(6).replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      window.addEventListener('hashchange', () => {
        if (!window.location.hash.startsWith('#data=')) return;
        try {
          applyImportedJson(decodeHashJson(), { fromUrl: true });
        } catch (err) {
          showToast(`共有リンクの読み込みに失敗しました: ${err.message}`, 'error');
        }
      });

      window.addEventListener('load', () => {
        let initial = null;
        let initialUnit = null;
        let hashError = null;
        if (window.location.hash.startsWith('#data=')) {
          try {
            const parsed = CadEngine.parseImportJson(decodeHashJson());
            initial = parsed;
            initialUnit = parsed.unit;
          } catch (err) {
            hashError = err.message;
          }
        }
        const model = initial || createDefaultResidentialModel();
        loadModelIntoState(model, initialUnit);

        bindUIEvents();
        setDrawerOpen(state.drawerOpen);
        setDeviceMode(state.deviceMode);
        syncGridButtons();
        resizeCanvas();
        pushHistory();
        fitView();
        renderAll();

        if (initial) {
          showToast(`共有リンクから図面を読み込みました (${model.floors.length}階 / ${model.zones.length}ゾーン)`, 'success');
        } else if (hashError) {
          showToast(`共有リンクの読み込みに失敗しました: ${hashError}`, 'error');
        }
      });
    })();
  </script>
</body>
</html>
