  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFFFFF;
      color: #202124;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* スクロールバー（ライト・控えめ） */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #DADCE0; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #BDC1C6; }

    /* CAD キャンバス（ブラウザ標準ジェスチャー完全抑止） */
    canvas#cadCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    /* Material Design 3 状態クラス */
    .md-rail-btn {
      color: #5F6368;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .md-rail-btn:hover:not(:disabled) {
      background-color: #F1F3F4;
      color: #202124;
    }
    .md-rail-btn.active {
      background-color: #E8F0FE;
      color: #174EA6;
    }
    .md-seg-btn {
      color: #5F6368;
      transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }
    .md-seg-btn:hover {
      color: #202124;
    }
    .md-seg-btn.active {
      background-color: #FFFFFF;
      color: #174EA6;
      box-shadow: 0 1px 2px rgba(60,64,67,0.14);
    }
    .md-tab-btn {
      color: #5F6368;
      border-bottom: 2px solid transparent;
      transition: color 140ms ease, border-color 140ms ease, background-color 140ms ease;
    }
    .md-tab-btn:hover {
      color: #202124;
      background-color: #F8F9FA;
    }
    .md-tab-btn.active {
      color: #1A73E8;
      border-bottom-color: #1A73E8;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Material スライダー */
    input[type="range"].md-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 999px;
      background: #E0E3E7;
      outline: none;
    }
    input[type="range"].md-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #1A73E8;
      cursor: pointer;
      border: 2px solid #FFFFFF;
      box-shadow: 0 1px 3px rgba(60,64,67,0.35);
    }
  </style>
</head>
<body class="font-sans text-md-text flex flex-col h-screen w-screen overflow-hidden">

  <!-- ==================== トップアプリバー (高さ52px) ==================== -->
  <header class="h-[52px] bg-white border-b border-md-border px-3 flex items-center justify-between gap-2 shrink-0 z-30">
    <!-- 左：ブランドロゴ + フロア切替セグメント -->
    <div class="flex items-center gap-3 min-w-0">
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-md-primaryContainer text-md-primary flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v14a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h6a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4z" />
          </svg>
        </div>
        <div class="hidden sm:block leading-tight">
          <div class="text-[13px] font-semibold text-md-text tracking-tight">ArchiZone Bridge</div>
          <div class="text-[10px] text-md-secondary">Archicad AI ゾーニングCAD</div>
        </div>
      </div>

      <div class="h-5 w-px bg-md-border shrink-0 hidden sm:block"></div>

      <!-- フロア切替セグメント + 追加・設定ポップオーバー -->
      <div class="flex items-center gap-1 min-w-0">
        <div id="floorSegmentContainer" class="flex items-center bg-md-container p-0.5 rounded-lg overflow-x-auto no-scrollbar max-w-[210px] sm:max-w-[300px]">
          <!-- JSで動的にフロアボタンを生成 -->
        </div>
        <button id="btnAddFloorQuick" class="w-7 h-7 rounded-lg hover:bg-md-container text-md-secondary hover:text-md-text flex items-center justify-center shrink-0 transition-colors" title="上階フロアを追加">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/></svg>
        </button>
        <div class="relative shrink-0">
          <button id="btnFloorPopover" class="h-7 px-2 rounded-lg hover:bg-md-container text-xs font-medium text-md-secondary hover:text-md-text flex items-center gap-1 transition-colors" title="フロア高さ・名称・削除を設定">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
            <span class="hidden md:inline">階高設定</span>
          </button>
          <!-- フロア設定ポップオーバー -->
          <div id="floorPopover" class="hidden absolute left-0 top-9 w-[340px] bg-white border border-md-border rounded-xl shadow-md-pop p-3 z-50">
            <div class="flex items-center justify-between mb-2 pb-2 border-b border-md-border">
              <span class="text-xs font-semibold text-md-text">フロア構成・基準レベル</span>
              <button id="btnAddFloorInPop" class="text-[11px] font-medium text-md-primary hover:underline">+ 階を追加</button>
            </div>
            <div id="floorPopoverList" class="space-y-2 max-h-64 overflow-y-auto pr-0.5"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右：単位切替 + スナップ設定ポップオーバー + テスト実行 + プライマリ「JSONコピー」 + ドロワー切替 -->
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      <!-- 単位切替 (mm / m) -->
      <div class="flex items-center bg-md-container p-0.5 rounded-lg" title="表示およびJSON出力の単位を切替">
        <button id="unitMmBtn" class="md-seg-btn active px-2 py-1 rounded-md text-[11px] font-mono font-semibold">mm</button>
        <button id="unitMBtn" class="md-seg-btn px-2 py-1 rounded-md text-[11px] font-mono font-semibold">m</button>
      </div>

      <!-- スナップ＆表示設定ポップオーバー -->
      <div class="relative">
        <button id="btnSnapPopover" class="h-8 px-2.5 rounded-lg border border-md-border bg-white hover:bg-md-surface text-xs font-medium text-md-text flex items-center gap-1.5 transition-colors">
          <svg class="w-4 h-4 text-md-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16M4 16h16M8 4v16M16 4v16"/></svg>
          <span class="hidden lg:inline">スナップ・表示</span>
          <span id="snapSummaryPill" class="font-mono text-[10px] text-md-secondary">910</span>
        </button>

        <div id="snapPopover" class="hidden absolute right-0 top-10 w-72 bg-white border border-md-border rounded-xl shadow-md-pop p-3.5 z-50 space-y-3">
          <div class="text-xs font-semibold text-md-text">グリッド・スナップ設定</div>
          <div>
            <label class="block text-[11px] text-md-secondary mb-1">グリッド間隔 (モジュール)</label>
            <div class="grid grid-cols-5 gap-1">
              <button data-grid-mm="100" class="grid-opt-btn py-1 rounded-md border border-md-border text-[11px] font-mono hover:bg-md-surface">100</button>
              <button data-grid-mm="455" class="grid-opt-btn py-1 rounded-md border border-md-border text-[11px] font-mono hover:bg-md-surface">455</button>
              <button data-grid-mm="500" class="grid-opt-btn py-1 rounded-md border border-md-border text-[11px] font-mono hover:bg-md-surface">500</button>
              <button data-grid-mm="910" class="grid-opt-btn py-1 rounded-md border border-md-border text-[11px] font-mono hover:bg-md-surface">910</button>
              <button data-grid-mm="1000" class="grid-opt-btn py-1 rounded-md border border-md-border text-[11px] font-mono hover:bg-md-surface">1000</button>
            </div>
          </div>

          <div class="space-y-2 pt-1 border-t border-md-border text-xs">
            <label class="flex items-center justify-between cursor-pointer py-0.5">
              <span class="text-md-text">グリッドスナップ <span class="text-[10px] text-md-muted font-mono">(G)</span></span>
              <input id="chkSnapGrid" type="checkbox" checked class="w-4 h-4 accent-[#1A73E8] rounded" />
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
              <span class="text-md-text">頂点スナップ <span class="text-[10px] text-md-muted font-mono">(M)</span></span>
              <input id="chkSnapVertex" type="checkbox" checked class="w-4 h-4 accent-[#1A73E8] rounded" />
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
              <span class="text-md-text">辺（エッジ）スナップ</span>
              <input id="chkSnapEdge" type="checkbox" checked class="w-4 h-4 accent-[#1A73E8] rounded" />
            </label>
          </div>

          <div class="space-y-2 pt-2 border-t border-md-border text-xs">
            <div class="text-[11px] font-semibold text-md-secondary">図面表示レイヤー</div>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
              <span class="text-md-text">下階オニオンスキン参照 <span class="text-[10px] text-md-muted font-mono">(O)</span></span>
              <input id="chkOnionSkin" type="checkbox" checked class="w-4 h-4 accent-[#1A73E8] rounded" />
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
              <span class="text-md-text">共有壁プレビュー (derivedWalls)</span>
              <input id="chkWallPreview" type="checkbox" class="w-4 h-4 accent-[#1A73E8] rounded" />
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
              <span class="text-md-text">辺の寸法・ゾーンラベル</span>
              <input id="chkShowDims" type="checkbox" checked class="w-4 h-4 accent-[#1A73E8] rounded" />
            </label>
          </div>
        </div>
      </div>

      <!-- 出力テスト実行ボタン + 結果バッジ -->
      <button id="btnRunTestsTop" class="h-8 px-2.5 rounded-lg border border-md-border bg-white hover:bg-md-surface text-xs font-medium text-md-text flex items-center gap-1.5 transition-colors" title="幾何エンジンとJSON出力の自動検証テストを実行">
        <span id="topTestDot" class="w-2 h-2 rounded-full bg-md-success"></span>
        <span class="hidden md:inline">出力テスト</span>
        <span id="topTestBadge" class="font-mono text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-50 text-md-success font-semibold tabular-nums">7/7</span>

      <!-- プライマリボタン：JSONコピー -->
      <button id="btnCopyJsonTop" class="h-8 px-3 rounded-lg bg-md-primary hover:bg-md-primaryHover text-white text-xs font-medium flex items-center gap-1.5 shadow-sm transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>

      <!-- 右インスペクター開閉ボタン -->
      <button id="btnToggleDrawer" class="w-8 h-8 rounded-lg border border-md-border bg-white hover:bg-md-surface text-md-secondary hover:text-md-text flex items-center justify-center transition-colors" title="インスペクターパネルを開閉">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </div>
  </header>

  <!-- ==================== トースト通知コンテナ ==================== -->

  <!-- ==================== アプリケーションロジック ==================== -->
  <script>
    (() => {
      'use strict';

      /* =========================================================================
       * 1. 定数・落ち着いたパステル建築ゾーニングカラーパレット・ユーティリティ
       * ========================================================================= */
      const TSUBO_SQM = 3.305785124;

      // 白背景に映える落ち着いた建築図面向け8カテゴリパレット
      const ZONE_CATEGORIES = {
        Living:      { label: 'リビング・居室', fill: '#FEF3C7', stroke: '#D97706' },
        Wet:         { label: '水回り',         fill: '#E0F2FE', stroke: '#0284C7' },
        Circulation: { label: '動線・階段',     fill: '#F1F5F9', stroke: '#64748B' },
        Storage:     { label: '収納・WIC',      fill: '#EDE9FE', stroke: '#7C3AED' },
        Entrance:    { label: 'エントランス',   fill: '#FFEDD5', stroke: '#EA580C' },
        Work:        { label: 'ワーク・書斎',   fill: '#DCFCE7', stroke: '#16A34A' },
        Exterior:    { label: '外部・テラス',   fill: '#ECFCCB', stroke: '#65A30D' },
        Other:       { label: 'その他',         fill: '#FCE7F3', stroke: '#DB2777' }
      };

      const uid = (prefix = 'id') => `${prefix}-${Math.random().toString(36).slice(2, 7)}${Date.now().toString(36).slice(-3)}`;

      // 浮動小数点ゴミを発生させない精密変換（内部はmm保持）
      const roundMm = (v) => {
        const r = Math.round(Number(v) * 1000) / 1000;
        return Object.is(r, -0) ? 0 : r;
      };
      const snapRoundMm = (v) => {
        const r = Math.round(Number(v));
        return Object.is(r, -0) ? 0 : r;
      };
      const mmToUnit = (mmVal, unit) => {
        if (unit === 'm') {
          const val = Number((Number(mmVal) / 1000).toFixed(4));
          return Object.is(val, -0) ? 0 : val;
        }
        return roundMm(mmVal);
      };
      const unitToMm = (val, unit) => {
        const n = Number(val);
        if (!Number.isFinite(n)) return 0;
        if (unit === 'm') return roundMm(Math.round(n * 1000000) / 1000);
        return roundMm(n);
      };
      const formatLen = (mmVal, unit) => {
        if (unit === 'm') {
          const s = (mmVal / 1000).toFixed(3).replace(/\.?0+$/, '');
          return `${s === '-0' ? '0' : s}m`;
        }
        return `${Math.round(mmVal).toLocaleString()}mm`;
      };
      const formatCoord = (mmVal, unit) => {
        if (unit === 'm') return (mmVal / 1000).toFixed(3);
        return String(Math.round(mmVal));
      };
      const escapeHtml = (str) => String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      // Material Snackbar 風トースト通知（alert()は使用しない）
      function showToast(msg, type = 'info') {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        const dotColor = type === 'success' ? 'bg-emerald-400' : (type === 'error' ? 'bg-red-400' : 'bg-blue-400');
        el.className = 'bg-[#202124] text-white px-4 py-2 rounded-full shadow-md-pop text-xs font-medium flex items-center gap-2 transition-all duration-200';
        el.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><span>${escapeHtml(msg)}</span>`;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(-4px)';
          setTimeout(() => el.remove(), 200);
        }, 2400);
      }

      // 安全なクリップボードコピー
      function copyTextToClipboard(text, successMsg) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) {
            showToast(successMsg, 'success');
            return;
          }
        } catch (err) {
          console.warn('execCommand fallback:', err);
        }
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(successMsg, 'success'))
            .catch(() => showToast('コピーできませんでした。JSONエディタから手動でコピーしてください。', 'error'));
        } else {
          showToast('コピーできませんでした。', 'error');
        }
      }

      /* =========================================================================
       * 2. 純粋関数CAD幾何エンジン（ユニットテストから直接呼び出し可能）
       * ========================================================================= */
      const CadEngine = {
        // 画面座標 ⇔ CAD右手座標系(+X右, +Y上) 変換
        cadToScreen(wx, wy, view) {
          return {
            x: wx * view.scale + view.panX,
            y: view.panY - wy * view.scale
          };
        },

        screenToCad(sx, sy, view) {
          return {
            x: (sx - view.panX) / view.scale,
            y: (view.panY - sy) / view.scale
          };
        },

        // 指定スクリーン座標 (anchorSx, anchorSy) のCADワールド座標を不変に保ちながらズーム
        zoomAtScreenPoint(view, anchorSx, anchorSy, targetScale, minScale = 0.004, maxScale = 1.2) {
          const clamped = Math.max(minScale, Math.min(maxScale, targetScale));
          const cadBefore = this.screenToCad(anchorSx, anchorSy, view);
          return {
            scale: clamped,
            panX: anchorSx - cadBefore.x * clamped,
            panY: anchorSy + cadBefore.y * clamped
          };
        },

        // 符号付き面積の2倍（右手座標系では >0 が反時計回り CCW）
        signedArea2(pts) {
          if (!pts || pts.length < 3) return 0;
          let sum = 0;
          for (let i = 0; i < pts.length; i++) {
            const a = pts[i];
            const b = pts[(i + 1) % pts.length];
            sum += a.x * b.y - b.x * a.y;
          }
          return sum;
        },

        // ポリゴンをCCW（反時計回り）へ自動正規化し連続重複頂点を除去
        normalizeCCW(pts) {
          const out = [];
          for (const raw of pts || []) {
            const p = { x: roundMm(raw.x), y: roundMm(raw.y) };
            const prev = out[out.length - 1];
            if (!prev || Math.hypot(p.x - prev.x, p.y - prev.y) > 0.5) {
              out.push(p);
            }
          }
          if (out.length > 1 && Math.hypot(out[0].x - out[out.length - 1].x, out[0].y - out[out.length - 1].y) <= 0.5) {
            out.pop();
          }
          if (out.length >= 3 && this.signedArea2(out) < 0) {
            out.reverse();
          }
          return out;
        },

        areaMm2(pts) {
          return Math.abs(this.signedArea2(pts)) / 2;
        },

        areaSqm(pts) {
          return this.areaMm2(pts) / 1_000_000;
        },

        perimeterMm(pts) {
          if (!pts || pts.length < 2) return 0;
          let sum = 0;
          for (let i = 0; i < pts.length; i++) {
            const a = pts[i], b = pts[(i + 1) % pts.length];
            sum += Math.hypot(b.x - a.x, b.y - a.y);
          }
          return sum;
        },

        boundingBox(pts) {
          if (!pts || pts.length === 0) return { minX: 0, minY: 0, maxX: 0, maxY: 0, width: 0, depth: 0 };
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          for (const p of pts) {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
          }
          return {
            minX: roundMm(minX), minY: roundMm(minY),
            maxX: roundMm(maxX), maxY: roundMm(maxY),
            width: roundMm(maxX - minX), depth: roundMm(maxY - minY)
          };
        },

        pointInPolygon(pt, pts) {
          let inside = false;
          for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const xi = pts[i].x, yi = pts[i].y;
            const xj = pts[j].x, yj = pts[j].y;
            const intersect = ((yi > pt.y) !== (yj > pt.y)) &&
              (pt.x < ((xj - xi) * (pt.y - yi)) / ((yj - yi) || 1e-12) + xi);
            if (intersect) inside = !inside;
          }
          return inside;
        },

        closestPointOnSegment(p, a, b) {
          const dx = b.x - a.x, dy = b.y - a.y;
          const len2 = dx * dx + dy * dy;
          if (len2 < 1e-9) return { x: a.x, y: a.y, dist: Math.hypot(p.x - a.x, p.y - a.y), t: 0 };
          const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
          const cx = a.x + t * dx, cy = a.y + t * dy;
          return { x: cx, y: cy, dist: Math.hypot(p.x - cx, p.y - cy), t };
        },

        // ポリゴンの自己交差判定（検証テスト用）
        hasSelfIntersection(pts) {
          if (!pts || pts.length < 4) return false;
          const n = pts.length;
          const ccw = (A, B, C) => (C.y - A.y) * (B.x - A.x) - (B.y - A.y) * (C.x - A.x);
          const segmentsCrossProperly = (a, b, c, d) => {
            const eps = 1e-4;
            const d1 = ccw(a, b, c);
            const d2 = ccw(a, b, d);
            const d3 = ccw(c, d, a);
            const d4 = ccw(c, d, b);
            if (((d1 > eps && d2 < -eps) || (d1 < -eps && d2 > eps)) &&
                ((d3 > eps && d4 < -eps) || (d3 < -eps && d4 > eps))) {
              return true;
            }
            return false;
          };
          for (let i = 0; i < n; i++) {
            const a = pts[i], b = pts[(i + 1) % n];
            for (let j = i + 2; j < n; j++) {
              if (i === 0 && j === n - 1) continue; // 隣接辺は除外
              const c = pts[j], d = pts[(j + 1) % n];
              if (segmentsCrossProperly(a, b, c, d)) return true;
            }
          }
          return false;
        },

        // 軸平行矩形かどうか判定
        isAxisAlignedRect(pts) {
          if (!pts || pts.length !== 4) return false;
          const bb = this.boundingBox(pts);
          if (bb.width < 1 || bb.depth < 1) return false;
          const corners = [
            { x: bb.minX, y: bb.minY }, { x: bb.maxX, y: bb.minY },
            { x: bb.maxX, y: bb.maxY }, { x: bb.minX, y: bb.maxY }
          ];
          return corners.every(c => pts.some(p => Math.hypot(p.x - c.x, p.y - c.y) <= 1.0));
        },

        // 凹多角形でも必ず内部に来るラベル配置点
        labelPoint(pts) {
          if (!pts || pts.length < 3) return { x: 0, y: 0 };
          let cx = 0, cy = 0, a2 = 0;
          for (let i = 0; i < pts.length; i++) {
            const p0 = pts[i], p1 = pts[(i + 1) % pts.length];
            const cross = p0.x * p1.y - p1.x * p0.y;
            a2 += cross;
            cx += (p0.x + p1.x) * cross;
            cy += (p0.y + p1.y) * cross;
          }
          if (Math.abs(a2) > 1e-6) {
            const c = { x: cx / (3 * a2), y: cy / (3 * a2) };
            if (this.pointInPolygon(c, pts)) return c;
          }
          const bb = this.boundingBox(pts);
          let best = { x: (bb.minX + bb.maxX) / 2, y: (bb.minY + bb.maxY) / 2 };
          let bestSpan = -1;
          for (const frac of [0.5, 0.35, 0.65, 0.22, 0.78]) {
            const y = bb.minY + bb.depth * frac;
            const xs = [];
            for (let i = 0; i < pts.length; i++) {
              const a = pts[i], b = pts[(i + 1) % pts.length];
              if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) {
                xs.push(a.x + ((y - a.y) * (b.x - a.x)) / (b.y - a.y));
              }
            }
            xs.sort((u, v) => u - v);
            for (let k = 0; k + 1 < xs.length; k += 2) {
              const span = xs[k + 1] - xs[k];
              if (span > bestSpan) {
                bestSpan = span;
                best = { x: (xs[k] + xs[k + 1]) / 2, y };
              }
            }
          }
          return best;
        },

        // 区間分割による厳密な共有壁マージアルゴリズム（T-junction・部分重複対応）
        computeDerivedWallsForFloor(floor, floorZones) {
          const walls = [];
          const DIST_TOL = 1.5; // 1.5mm以内の共線辺を同一直線とみなす
          const lineBuckets = [];

          for (const z of floorZones) {
            const verts = this.normalizeCCW(z.vertices);
            if (verts.length < 3) continue;
            for (let i = 0; i < verts.length; i++) {
              const a = verts[i];
              const b = verts[(i + 1) % verts.length];
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const len = Math.hypot(dx, dy);
              if (len < 1.0) continue;

              // 正規化方向ベクトル（必ず +X優先 / +Y方向へ統一）
              let ux = dx / len;
              let uy = dy / len;
              let dirSign = 1;
              if (ux < -1e-6 || (Math.abs(ux) <= 1e-6 && uy < 0)) {
                ux = -ux;
                uy = -uy;
                dirSign = -1;
              }
              // 原点からの符号付き法線距離 d = -uy*x + ux*y
              const d = -uy * a.x + ux * a.y;
              const tA = ux * a.x + uy * a.y;
              const tB = ux * b.x + uy * b.y;
              const tMin = Math.min(tA, tB);
              const tMax = Math.max(tA, tB);

              let bucket = lineBuckets.find(L =>
                Math.abs(L.ux - ux) < 1e-3 &&
                Math.abs(L.uy - uy) < 1e-3 &&
                Math.abs(L.d - d) <= DIST_TOL
              );
              if (!bucket) {
                bucket = { ux, uy, d, segments: [] };
                lineBuckets.push(bucket);
              }
              bucket.segments.push({
                tMin, tMax, dirSign,
                zoneId: z.id,
                height: z.height || floor.height || 2600
              });
            }
          }

          let seq = 1;
          for (const L of lineBuckets) {
            // 全端点の射影値 t を収集し重複統合して昇順ソート（これでT字接合や部分重複を完全分割）
            const rawTs = [];
            for (const s of L.segments) rawTs.push(s.tMin, s.tMax);
            rawTs.sort((a, b) => a - b);
            const ts = [];
            for (const t of rawTs) {
              if (ts.length === 0 || Math.abs(t - ts[ts.length - 1]) > 0.5) ts.push(t);
            }

            // 微小区間ごとに所属ゾーンを判定
            const elementary = [];
            for (let k = 0; k < ts.length - 1; k++) {
              const t0 = ts[k], t1 = ts[k + 1];
              if (t1 - t0 < 1.0) continue;
              const tMid = (t0 + t1) / 2;
              const covering = L.segments.filter(s => s.tMin <= tMid + 0.25 && s.tMax >= tMid - 0.25);
              if (covering.length === 0) continue;

              // ゾーンID重複除去
              const uniqueByZone = new Map();
              for (const c of covering) uniqueByZone.set(c.zoneId, c);
              const adjList = Array.from(uniqueByZone.values());
              const adjacentZoneIds = adjList.map(a => a.zoneId).sort();

              // 2つ以上のゾーンで共有される区間 -> interior、単独 -> exterior
              const type = adjacentZoneIds.length >= 2 ? 'interior' : 'exterior';
              const heightMm = Math.max(...adjList.map(a => a.height));

              elementary.push({
                t0, t1, type, adjacentZoneIds, heightMm,
                mergeKey: `${type}|${adjacentZoneIds.join(',')}|${heightMm}`
              });
            }

            // 同一属性の連続区間を再統合
            const merged = [];
            for (const seg of elementary) {
              const prev = merged[merged.length - 1];
              if (prev && prev.mergeKey === seg.mergeKey && Math.abs(prev.t1 - seg.t0) <= 1.0) {
                prev.t1 = seg.t1;
              } else {
                merged.push({ ...seg });
              }
            }

            // 1D射影パラメータ t から2D座標へ逆変換
            for (const m of merged) {
              const sx = roundMm(L.ux * m.t0 - L.uy * L.d);
              const sy = roundMm(L.uy * m.t0 + L.ux * L.d);
              const ex = roundMm(L.ux * m.t1 - L.uy * L.d);
              const ey = roundMm(L.uy * m.t1 + L.ux * L.d);
              const lengthMm = roundMm(Math.hypot(ex - sx, ey - sy));
              if (lengthMm < 1.0) continue;

              walls.push({
                id: `W-${floor.name}-${String(seq++).padStart(2, '0')}`,
                type: m.type,
                start: { x: sx, y: sy },
                end: { x: ex, y: ey },
                lengthMm,
                heightMm: m.heightMm,
                adjacentZoneIds: m.adjacentZoneIds
              });
            }
          }
          return walls;
        },

        // エクスポートJSON生成（任意のデータモデル・単位で純粋実行可能）
        buildExportJson(model, unit) {
          const u = unit === 'm' ? 'm' : 'mm';
          const c = (mm) => mmToUnit(mm, u);
          const cp = (p) => ({ x: c(p.x), y: c(p.y) });

          const sortedFloors = [...model.floors].sort((a, b) => a.index - b.index);
          const siteNorm = (model.siteBoundary && model.siteBoundary.length >= 3)
            ? this.normalizeCCW(model.siteBoundary)
            : [];

          const floorsPayload = sortedFloors.map(f => {
            const fZones = model.zones.filter(z => z.floorId === f.id);
            const derivedWalls = this.computeDerivedWallsForFloor(f, fZones).map(w => ({
              id: w.id,
              type: w.type,
              start: cp(w.start),
              end: cp(w.end),
              length: c(w.lengthMm),
              height: c(w.heightMm),
              adjacentZoneIds: w.adjacentZoneIds
            }));

            return {
              id: f.id,
              index: f.index,
              name: f.name,
              elevation: c(f.elevation),
              height: c(f.height),
              zones: fZones.map(z => {
                const norm = this.normalizeCCW(z.vertices);
                const bb = this.boundingBox(norm);
                const baseOff = z.baseOffset || 0;
                return {
                  id: z.id,
                  zoneNumber: z.zoneNumber || '',
                  name: z.name || '',
                  category: z.category || 'Other',
                  elevation: c(f.elevation + baseOff),
                  baseOffset: c(baseOff),
                  height: c(z.height || f.height),
                  areaSqm: Number(this.areaSqm(norm).toFixed(2)),
                  perimeterM: Number((this.perimeterMm(norm) / 1000).toFixed(2)),
                  boundingBox: {
                    minX: c(bb.minX), minY: c(bb.minY),
                    maxX: c(bb.maxX), maxY: c(bb.maxY),
                    width: c(bb.width), depth: c(bb.depth)
                  },
                  vertices: norm.map(cp),
                  aiNotes: z.aiNotes || ''
                };
              }),
              derivedWalls
            };
          });

          const totalIndoorSqm = model.zones
            .filter(z => z.category !== 'Exterior')
            .reduce((acc, z) => acc + this.areaSqm(z.vertices), 0);
          const firstFloor = sortedFloors[0];
          const footprintSqm = firstFloor
            ? model.zones
                .filter(z => z.floorId === firstFloor.id && z.category !== 'Exterior')
                .reduce((acc, z) => acc + this.areaSqm(z.vertices), 0)
            : 0;
          const siteAreaSqm = siteNorm.length >= 3 ? this.areaSqm(siteNorm) : 0;

          return {
            schemaVersion: '1.1',
            coordinateSystem: {
              type: 'right-handed',
              xAxis: '+X right',
              yAxis: '+Y up',
              polygonWinding: 'CCW'
            },
            unit: u,
            project: {
              name: model.projectName || 'Untitled Project',
              buildingFootprintSqm: Number(footprintSqm.toFixed(2)),
              totalFloorAreaSqm: Number(totalIndoorSqm.toFixed(2)),
              approxBCRPercent: siteAreaSqm > 0 ? Number(((footprintSqm / siteAreaSqm) * 100).toFixed(1)) : null,
              approxFARPercent: siteAreaSqm > 0 ? Number(((totalIndoorSqm / siteAreaSqm) * 100).toFixed(1)) : null
            },
            site: siteNorm.length >= 3 ? {
              areaSqm: Number(siteAreaSqm.toFixed(2)),
              vertices: siteNorm.map(cp)
            } : null,
            floors: floorsPayload
          };
        },

        // インポートJSONパーサー（厳格な入力検証＆内部mmモデルへの復元）
        parseImportJson(rawStr) {
          const LIM = { bytes: 5 * 1024 * 1024, floors: 100, zones: 5000, verts: 2000, absMm: 1e8, note: 5000 };
          if (typeof rawStr !== 'string') throw new Error('入力は文字列である必要があります。');
          const trimmed = rawStr.trim();
          if (!trimmed) throw new Error('JSONが空です。JSONテキストを貼り付けてください。');
          if (rawStr.length > LIM.bytes) throw new Error('JSONが大きすぎます (上限5MB)。');
          let parsed;
          try {
            parsed = JSON.parse(trimmed);
          } catch (firstErr) {
            const fenceMatch = trimmed.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
            let candidate = fenceMatch ? fenceMatch[1].trim() : '';
            if (!candidate) {
              const firstBrace = trimmed.indexOf('{');
              const lastBrace = trimmed.lastIndexOf('}');
              if (firstBrace >= 0 && lastBrace > firstBrace) {
                candidate = trimmed.slice(firstBrace, lastBrace + 1);
              }
            }
            if (!candidate) throw new Error(`JSON構文エラー: ${firstErr.message}`);
            try {
              parsed = JSON.parse(candidate);
            } catch (e) {
              throw new Error(`JSON構文エラー: ${e.message}`);
            }
          }
          const isObj = (o) => o !== null && typeof o === 'object' && !Array.isArray(o);
          if (!isObj(parsed)) throw new Error('ルートはJSONオブジェクトである必要があります。');
          if (parsed.unit !== undefined && parsed.unit !== 'mm' && parsed.unit !== 'm') {
            throw new Error(`unit は "mm" か "m" のみ指定できます (受信: ${String(parsed.unit).slice(0, 20)})。`);
          }
          const inUnit = parsed.unit === 'm' ? 'm' : 'mm';
          const num = (v, label) => {
            if (typeof v !== 'number' || !Number.isFinite(v)) throw new Error(`${label} は有限の数値である必要があります。`);
            const mm = unitToMm(v, inUnit);
            if (Math.abs(mm) > LIM.absMm) throw new Error(`${label} の値が範囲外です。`);
            return mm;
          };
          const str = (v, fallback, max = 200) =>
            (v === undefined || v === null || v === '' ? fallback : String(v)).replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, max);
          const usedIds = new Set();
          const safeId = (v, prefix) => {
            let id = typeof v === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : uid(prefix);
            while (usedIds.has(id)) id = uid(prefix);
            usedIds.add(id);
            return id;
          };
          const readVerts = (arr, label) => {
            if (!Array.isArray(arr) || arr.length < 3) throw new Error(`${label} には3点以上の頂点が必要です。`);
            if (arr.length > LIM.verts) throw new Error(`${label} の頂点数が多すぎます (上限${LIM.verts})。`);
            const pts = arr.map((p, i) => {
              if (!isObj(p)) throw new Error(`${label} の頂点[${i}]は {x, y} である必要があります。`);
              return { x: num(p.x, `${label} 頂点[${i}].x`), y: num(p.y, `${label} 頂点[${i}].y`) };
            });
            const norm = this.normalizeCCW(pts);
            if (!(Math.abs(this.signedArea2(norm)) > 1e-6)) throw new Error(`${label} の面積が0です。`);
            return norm;
          };

          if (!Array.isArray(parsed.floors) || parsed.floors.length === 0) {
            throw new Error('floors 配列に最低1つのフロアが必要です。');
          }
          if (parsed.floors.length > LIM.floors) throw new Error(`フロア数が多すぎます (上限${LIM.floors})。`);

          const floors = [];
          const zones = [];
          parsed.floors.forEach((f, fIdx) => {
            if (!isObj(f)) throw new Error(`floors[${fIdx}] はオブジェクトである必要があります。`);
            const fId = safeId(f.id, 'floor');
            const elev = num(f.elevation ?? (inUnit === 'm' ? fIdx * 2.8 : fIdx * 2800), `floors[${fIdx}].elevation`);
            const height = Math.max(1000, num(f.height ?? (inUnit === 'm' ? 2.8 : 2800), `floors[${fIdx}].height`));
            const fName = str(f.name, `${fIdx + 1}F`, 50);
            floors.push({
              id: fId,
              index: Number.isFinite(f.index) ? f.index : fIdx,
              name: fName,
              elevation: elev,
              height
            });
            if (f.zones !== undefined && !Array.isArray(f.zones)) throw new Error(`フロア ${fName} の zones は配列である必要があります。`);
            (f.zones || []).forEach((z, zIdx) => {
              if (!isObj(z)) throw new Error(`フロア ${fName} のゾーン[${zIdx}]はオブジェクトである必要があります。`);
              if (zones.length >= LIM.zones) throw new Error(`ゾーン数が多すぎます (上限${LIM.zones})。`);
              const zLabel = `フロア ${fName} のゾーン[${zIdx}]`;
              const verts = readVerts(z.vertices, zLabel);
              const cat = typeof z.category === 'string' && Object.prototype.hasOwnProperty.call(ZONE_CATEGORIES, z.category) ? z.category : 'Other';
              const baseOffset = z.baseOffset !== undefined
                ? num(z.baseOffset, `${zLabel}.baseOffset`)
                : (z.elevation !== undefined ? roundMm(num(z.elevation, `${zLabel}.elevation`) - elev) : 0);
              zones.push({
                id: safeId(z.id, 'zone'),
                zoneNumber: str(z.zoneNumber, `Z-${fIdx + 1}${String(zIdx + 1).padStart(2, '0')}`, 30),
                name: str(z.name, `ゾーン ${zIdx + 1}`, 100),
                category: cat,
                floorId: fId,
                baseOffset,
                height: Math.max(300, num(z.height ?? (inUnit === 'm' ? 2.5 : 2500), `${zLabel}.height`)),
                vertices: verts,
                aiNotes: str(z.aiNotes, '', LIM.note)
              });
            });
          });
          floors.sort((a, b) => a.index - b.index);

          let siteBoundary = [];
          if (parsed.site !== undefined && parsed.site !== null) {
            if (!isObj(parsed.site)) throw new Error('site はオブジェクトである必要があります。');
            if (Array.isArray(parsed.site.vertices) && parsed.site.vertices.length >= 3) {
              siteBoundary = readVerts(parsed.site.vertices, 'site.vertices');
            }
          }

          return {
            unit: inUnit,
            projectName: str(parsed.project?.name, 'Imported Project', 100),
            floors,
            zones,
            siteBoundary
          };
        }
      };

      /* =========================================================================
       * 3. 初期サンプル住宅プラン（共有壁・T字接合を含む実用構成）

              ],

            },
            {
              id: 'z-202', zoneNumber: 'Z-202', name: '書斎・ワーク', category: 'Work',
              floorId: 'floor-2f', baseOffset: 0, height: 2400,
              vertices: [
                { x: 4550, y: 1820 }, { x: 9100, y: 1820 }, { x: 9100, y: 4550 }, { x: 4550, y: 4550 }
              ],
              aiNotes: '造作カウンターデスク、南東採光窓'
            },
            {

              floorId: 'floor-2f', baseOffset: 0, height: 2400,
              vertices: [
                { x: 3640, y: 4550 }, { x: 7280, y: 4550 }, { x: 7280, y: 6370 }, { x: 3640, y: 6370 }
              ],

      /* =========================================================================
       * 4. アプリケーション状態 & Undo/Redo
       * ========================================================================= */
      function detectInitialDeviceMode() {
        const ua = navigator.userAgent || '';
        const isIPadUA = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        return (isIPadUA || (navigator.maxTouchPoints > 1 && coarse)) ? 'ipad' : 'pc';
      }

      const state = {
        projectName: '',
        floors: [],
        activeFloorId: null,
        siteBoundary: [],
        zones: [],

        // 表示・スナップ設定
        unit: 'mm',            // 'mm' | 'm'
        gridSpacing: 910,      // 内部mm
        snapGrid: true,
        snapVertex: true,
        snapEdge: true,
        onionSkin: true,
        showWallPreview: false,
        showDimensions: true,

        // ツール・操作モード
        tool: 'select',        // 'select' | 'rect' | 'polygon' | 'site'
        deviceMode: detectInitialDeviceMode(), // 'pc' | 'ipad'
        ipadMode: 'edit',      // 'edit' | 'pan' | 'zoom'
        drawerOpen: window.innerWidth >= 1024,
        activeTab: 'props',    // 'props' | 'json' | 'tests'

        // 選択状態
        selection: null,       // { type: 'zone', id } | { type: 'site' } | null
        selectedVertexIdx: -1, // Deleteキーで選択頂点を削除可能にする

        // カメラビュー（panX, panYはCAD原点(0,0)のスクリーンpx位置、scaleはpx/mm）
        view: { panX: 160, panY: 500, scale: 0.055 },

        // 一時操作状態
        mouseCad: { x: 0, y: 0 },
        snappedCad: { x: 0, y: 0, snapType: null },
        shiftDown: false,
        spaceDown: false,
        drag: null,
        polyDraft: [],
        hoverHandle: null,

        // マルチタッチ追跡（iPad操作分離用）
        activePointers: new Map(),
        ipadGesture: null,     // { kind: 'pan'|'pinchZoom'|'dragZoom', ... }

        // 履歴・テスト結果
        history: [],
        historyIndex: -1,
        jsonDirty: false,
        lastTestReport: null
      };

      function snapshotModel() {
        return JSON.stringify({
          projectName: state.projectName,
          floors: state.floors,
          siteBoundary: state.siteBoundary,
          zones: state.zones,
          activeFloorId: state.activeFloorId
        });
      }

      function pushHistory() {
        const snap = snapshotModel();
        if (state.historyIndex >= 0 && state.history[state.historyIndex] === snap) return;
        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(snap);
        if (state.history.length > 60) state.history.shift();
        state.historyIndex = state.history.length - 1;
        updateHistoryButtons();
      }

      function restoreSnapshot(snapStr) {
        const d = JSON.parse(snapStr);
        state.projectName = d.projectName;
        state.floors = d.floors;
        state.siteBoundary = d.siteBoundary || [];
        state.zones = d.zones;
        state.activeFloorId = d.floors.some(f => f.id === d.activeFloorId) ? d.activeFloorId : (d.floors[0]?.id || null);
        if (state.selection?.type === 'zone' && !state.zones.some(z => z.id === state.selection.id)) {
          state.selection = null;
          state.selectedVertexIdx = -1;
        }
        if (state.selection?.type === 'site' && state.siteBoundary.length < 3) {
          state.selection = null;
          state.selectedVertexIdx = -1;
        }
        renderAll();
      }

      function undo() {
        if (state.historyIndex <= 0) return;
        state.historyIndex--;
        restoreSnapshot(state.history[state.historyIndex]);
        updateHistoryButtons();
        showToast('元に戻しました');
      }

      function redo() {
        if (state.historyIndex >= state.history.length - 1) return;
        state.historyIndex++;
        restoreSnapshot(state.history[state.historyIndex]);
        updateHistoryButtons();
        showToast('やり直しました');
      }

      function updateHistoryButtons() {
        document.getElementById('btnUndo').disabled = state.historyIndex <= 0;
        document.getElementById('btnRedo').disabled = state.historyIndex >= state.history.length - 1;
      }

      /* =========================================================================
       * 5. Canvas 管理・スナップ計算・ビューフィット
       * ========================================================================= */
      const canvas = document.getElementById('cadCanvas');
      const ctx = canvas.getContext('2d');
      const canvasContainer = document.getElementById('canvasContainer');
      let canvasW = 800, canvasH = 600, dpr = 1;

      function resizeCanvas() {
        const rect = canvasContainer.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        canvasW = Math.max(120, rect.width);
        canvasH = Math.max(120, rect.height);
        canvas.width = Math.round(canvasW * dpr);
        canvas.height = Math.round(canvasH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawCanvas();
      }

      const worldToScreen = (wx, wy) => CadEngine.cadToScreen(wx, wy, state.view);
      const screenToWorld = (sx, sy) => CadEngine.screenToCad(sx, sy, state.view);

      function getActiveFloor() {
        return state.floors.find(f => f.id === state.activeFloorId) || state.floors[0];
      }

      function getLowerFloor() {
        const active = getActiveFloor();
        if (!active) return null;
        const sorted = [...state.floors].sort((a, b) => a.index - b.index);
        const idx = sorted.findIndex(f => f.id === active.id);
        return idx > 0 ? sorted[idx - 1] : null;
      }

      function getSelectedZone() {
        if (state.selection?.type !== 'zone') return null;
        return state.zones.find(z => z.id === state.selection.id) || null;
      }

      function getSelectedVertices() {
        if (state.selection?.type === 'zone') return getSelectedZone()?.vertices || null;
        if (state.selection?.type === 'site') return state.siteBoundary;
        return null;
      }

      // Shiftキーで 0° / 45° / 90° 方向へ拘束
      function applyAngleConstraint(rawPt, anchor) {
        if (!anchor) return rawPt;
        const dx = rawPt.x - anchor.x;
        const dy = rawPt.y - anchor.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 1e-3) return rawPt;
        const angle = Math.atan2(dy, dx);
        const snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
        return {
          x: anchor.x + Math.cos(snappedAngle) * dist,
          y: anchor.y + Math.sin(snappedAngle) * dist
        };
      }

      function computeSnap(rawWorld, options = {}) {
        const { excludeId = null, excludeVertexIdx = -1, angleAnchor = null } = options;
        let pt = rawWorld;
        if (state.shiftDown && angleAnchor) {
          pt = applyAngleConstraint(rawWorld, angleAnchor);
        }

        const tolWorld = 12 / state.view.scale;
        const targetPolys = [];
        if (state.snapVertex || state.snapEdge) {
          for (const z of state.zones) {
            if (z.floorId === state.activeFloorId) targetPolys.push({ id: z.id, pts: z.vertices, closed: true });
          }
          if (state.onionSkin) {
            const lower = getLowerFloor();
            if (lower) {
              for (const z of state.zones) {
                if (z.floorId === lower.id) targetPolys.push({ id: z.id, pts: z.vertices, closed: true });
              }
            }
          }
          if (state.siteBoundary.length >= 3) {
            targetPolys.push({ id: '__site__', pts: state.siteBoundary, closed: true });
          }
          if (state.polyDraft.length > 0) {
            targetPolys.push({ id: '__draft__', pts: state.polyDraft, closed: false });
          }
        }

        // 1) 頂点スナップ
        if (state.snapVertex) {
          let best = null, bestD = tolWorld;
          for (const poly of targetPolys) {
            for (let i = 0; i < poly.pts.length; i++) {
              if (poly.id === excludeId && i === excludeVertexIdx) continue;
              const v = poly.pts[i];
              const d = Math.hypot(pt.x - v.x, pt.y - v.y);
              if (d < bestD) { bestD = d; best = v; }
            }
          }
          if (best) return { x: roundMm(best.x), y: roundMm(best.y), snapType: 'vertex' };
        }

        // 2) 辺スナップ
        if (state.snapEdge) {
          let best = null, bestD = tolWorld * 0.8;
          for (const poly of targetPolys) {
            if (poly.id === excludeId || poly.pts.length < 2) continue;
            const count = poly.closed ? poly.pts.length : poly.pts.length - 1;
            for (let i = 0; i < count; i++) {
              const res = CadEngine.closestPointOnSegment(pt, poly.pts[i], poly.pts[(i + 1) % poly.pts.length]);
              if (res.dist < bestD) { bestD = res.dist; best = { x: res.x, y: res.y }; }
            }
          }
          if (best) return { x: snapRoundMm(best.x), y: snapRoundMm(best.y), snapType: 'edge' };
        }

        // 3) グリッドスナップ
        if (state.snapGrid) {
          const g = state.gridSpacing;
          const gx = Math.round(pt.x / g) * g;
          const gy = Math.round(pt.y / g) * g;
          return { x: snapRoundMm(gx), y: snapRoundMm(gy), snapType: 'grid' };
        }

        return { x: snapRoundMm(pt.x), y: snapRoundMm(pt.y), snapType: null };
      }

      function fitView() {
        const pts = [];
        const currZones = state.zones.filter(z => z.floorId === state.activeFloorId);
        const list = currZones.length > 0 ? currZones : state.zones;
        for (const z of list) pts.push(...z.vertices);
        if (state.siteBoundary.length >= 3) pts.push(...state.siteBoundary);

        let cx = 4550, cy = 3640, targetScale = Math.min(canvasW, canvasH) / 15000;
        if (pts.length > 0) {
          const bb = CadEngine.boundingBox(pts);
          cx = (bb.minX + bb.maxX) / 2;
          cy = (bb.minY + bb.maxY) / 2;
          const padW = Math.max(bb.width, 3200) * 1.32;
          const padH = Math.max(bb.depth, 3200) * 1.35;
          targetScale = Math.max(0.006, Math.min(0.45, Math.min((canvasW - 80) / padW, (canvasH - 110) / padH)));
        }
        state.view.scale = targetScale;
        state.view.panX = canvasW / 2 - cx * targetScale;
        state.view.panY = canvasH / 2 + cy * targetScale;
        syncZoomUI();
        drawCanvas();
      }

      function syncZoomUI() {
        const pct = Math.round((state.view.scale / 0.05) * 100);
        document.getElementById('statusZoom').textContent = `${pct}%`;
        const slider = document.getElementById('ipadZoomSlider');
        if (slider) {
          // 対数スケール [-200..200] <-> scale [0.008..0.4]
          const norm = Math.log(state.view.scale / 0.055) / Math.log(2) * 55;
          slider.value = String(Math.max(-200, Math.min(200, Math.round(norm))));
        }
      }

      /* =========================================================================
       * 6. 白基調 Material Design 3 CAD キャンバスレンダラー
       * ========================================================================= */
      function drawCanvas() {
        ctx.clearRect(0, 0, canvasW, canvasH);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvasW, canvasH);

        drawGridAndAxes();
        drawSiteBoundary();
        if (state.onionSkin) drawLowerFloorTrace();
        drawCurrentFloorZones();
        if (state.showWallPreview) drawDerivedWallsOverlay();
        drawSelectionHandles();
        drawInteractiveDrafts();
        drawSnapMarker();
      }

      function drawGridAndAxes() {
        const tl = screenToWorld(0, 0);
        const br = screenToWorld(canvasW, canvasH);
        const minX = Math.min(tl.x, br.x), maxX = Math.max(tl.x, br.x);
        const minY = Math.min(tl.y, br.y), maxY = Math.max(tl.y, br.y);

        let step = state.gridSpacing;
        while (step * state.view.scale < 14) step *= 2;
        const majorEvery = 5;

        const startX = Math.floor(minX / step) * step;
        const startY = Math.floor(minY / step) * step;

        ctx.lineWidth = 1;
        for (let x = startX; x <= maxX; x += step) {
          const sx = Math.round(worldToScreen(x, 0).x) + 0.5;
          const isMajor = Math.round(x / step) % majorEvery === 0;
          ctx.strokeStyle = isMajor ? '#E0E3E7' : '#F1F3F4';
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.lineTo(sx, canvasH);
          ctx.stroke();
        }
        for (let y = startY; y <= maxY; y += step) {
          const sy = Math.round(worldToScreen(0, y).y) + 0.5;
          const isMajor = Math.round(y / step) % majorEvery === 0;
          ctx.strokeStyle = isMajor ? '#E0E3E7' : '#F1F3F4';
          ctx.beginPath();
          ctx.moveTo(0, sy);
          ctx.lineTo(canvasW, sy);
          ctx.stroke();
        }

        // X軸 (#D93025) & Y軸 (#188038)
        const origin = worldToScreen(0, 0);
        ctx.lineWidth = 1.25;
        ctx.strokeStyle = 'rgba(217, 48, 37, 0.35)';
        ctx.beginPath();
        ctx.moveTo(0, origin.y);
        ctx.lineTo(canvasW, origin.y);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(24, 128, 56, 0.35)';
        ctx.beginPath();
        ctx.moveTo(origin.x, 0);
        ctx.lineTo(origin.x, canvasH);
        ctx.stroke();

        // 原点 (0, 0) インジケーター
        if (origin.x >= -50 && origin.x <= canvasW + 50 && origin.y >= -50 && origin.y <= canvasH + 50) {
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = '#D93025';
          ctx.beginPath();
          ctx.moveTo(origin.x, origin.y);
          ctx.lineTo(origin.x + 28, origin.y);
          ctx.stroke();

          ctx.strokeStyle = '#188038';
          ctx.beginPath();
          ctx.moveTo(origin.x, origin.y);
          ctx.lineTo(origin.x, origin.y - 28);
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#202124';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillStyle = '#5F6368';
          ctx.fillText('(0,0)', origin.x + 6, origin.y + 6);
          ctx.fillStyle = '#D93025';
          ctx.fillText('+X', origin.x + 31, origin.y - 5);
          ctx.fillStyle = '#188038';
          ctx.fillText('+Y', origin.x + 4, origin.y - 38);
        }
      }

      function drawSiteBoundary() {
        const pts = state.siteBoundary;
        if (!pts || pts.length < 3) return;
        const isSel = state.selection?.type === 'site';

        ctx.save();
        ctx.beginPath();
        pts.forEach((p, i) => {
          const s = worldToScreen(p.x, p.y);
          if (i === 0) ctx.moveTo(s.x, s.y);
          else ctx.lineTo(s.x, s.y);
        });
        ctx.closePath();

        ctx.fillStyle = isSel ? 'rgba(26, 115, 232, 0.04)' : 'rgba(248, 249, 250, 0.65)';
        ctx.fill();

        // 建築図面の敷地境界線（二点鎖線）
        ctx.strokeStyle = isSel ? '#1A73E8' : '#5F6368';
        ctx.lineWidth = isSel ? 2 : 1.5;
        ctx.setLineDash([14, 4, 2, 4, 2, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        const bb = CadEngine.boundingBox(pts);
        const tl = worldToScreen(bb.minX, bb.maxY);
        const area = CadEngine.areaSqm(pts);
        ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif';
        ctx.fillStyle = isSel ? '#174EA6' : '#5F6368';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`敷地境界  ${area.toFixed(2)}㎡ (${(area / TSUBO_SQM).toFixed(2)}坪)`, tl.x + 2, tl.y - 6);

        if (state.showDimensions && isSel) {
          drawPolygonDimensions(pts, '#174EA6');
        }
        ctx.restore();
      }

      function drawLowerFloorTrace() {
        const lower = getLowerFloor();
        if (!lower) return;
        const list = state.zones.filter(z => z.floorId === lower.id);
        if (list.length === 0) return;

        ctx.save();
        for (const z of list) {
          if (z.vertices.length < 3) continue;
          ctx.beginPath();
          z.vertices.forEach((p, i) => {
            const s = worldToScreen(p.x, p.y);
            if (i === 0) ctx.moveTo(s.x, s.y);
            else ctx.lineTo(s.x, s.y);
          });
          ctx.closePath();
          ctx.fillStyle = 'rgba(241, 243, 244, 0.45)';
          ctx.fill();
          ctx.strokeStyle = '#BDC1C6';
          ctx.lineWidth = 1.25;
          ctx.setLineDash([5, 4]);
          ctx.stroke();
          ctx.setLineDash([]);

          const lp = CadEngine.labelPoint(z.vertices);
          const sp = worldToScreen(lp.x, lp.y);
          ctx.font = '500 10px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif';
          ctx.fillStyle = '#9AA0A6';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`[${lower.name}] ${z.name}`, sp.x, sp.y);
        }
        ctx.restore();
      }

      function drawCurrentFloorZones() {
        const list = state.zones.filter(z => z.floorId === state.activeFloorId);
        for (const z of list) {
          if (z.vertices.length < 3) continue;
          const isSel = state.selection?.type === 'zone' && state.selection.id === z.id;
          const cat = ZONE_CATEGORIES[z.category] || ZONE_CATEGORIES.Other;

          ctx.save();
          ctx.beginPath();
          z.vertices.forEach((p, i) => {
            const s = worldToScreen(p.x, p.y);
            if (i === 0) ctx.moveTo(s.x, s.y);
            else ctx.lineTo(s.x, s.y);
          });
          ctx.closePath();

          // 落ち着いたパステル塗りつぶし
          ctx.globalAlpha = isSel ? 0.92 : 0.78;
          ctx.fillStyle = cat.fill;
          ctx.fill();
          ctx.globalAlpha = 1.0;

          // 境界線
          ctx.strokeStyle = isSel ? '#1A73E8' : cat.stroke;
          ctx.lineWidth = isSel ? 2.4 : 1.5;
          if (z.category === 'Exterior') ctx.setLineDash([6, 4]);
          ctx.stroke();
          ctx.setLineDash([]);

          // 辺寸法ラベル
          if (state.showDimensions) {
            drawPolygonDimensions(z.vertices, isSel ? '#174EA6' : '#5F6368');
          }

          // ゾーンラベル
          if (state.showDimensions) {
            const lp = CadEngine.labelPoint(z.vertices);
            const sp = worldToScreen(lp.x, lp.y);
            const area = CadEngine.areaSqm(z.vertices);
            const tsubo = area / TSUBO_SQM;
            const title = `${z.zoneNumber ? z.zoneNumber + ' ' : ''}${z.name}`;
            const sub = `${area.toFixed(2)}㎡ (${tsubo.toFixed(1)}坪)`;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif';
            ctx.fillStyle = '#202124';
            ctx.fillText(title, sp.x, sp.y - (z.aiNotes ? 9 : 6));

            ctx.font = '500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
            ctx.fillStyle = '#5F6368';
            ctx.fillText(sub, sp.x, sp.y + (z.aiNotes ? 4 : 8));

            if (z.aiNotes) {
              ctx.font = '500 9.5px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif';
              ctx.fillStyle = '#174EA6';
              const shortNote = z.aiNotes.length > 14 ? z.aiNotes.slice(0, 14) + '…' : z.aiNotes;
              ctx.fillText(`Memo: ${shortNote}`, sp.x, sp.y + 16);
            }
          }
          ctx.restore();
        }
      }

      function drawPolygonDimensions(pts, textColor) {
        ctx.save();
        ctx.font = '500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          const lenMm = Math.hypot(b.x - a.x, b.y - a.y);
          const sa = worldToScreen(a.x, a.y);
          const sb = worldToScreen(b.x, b.y);
          const pxLen = Math.hypot(sb.x - sa.x, sb.y - sa.y);
          if (pxLen < 42) continue;

          const mx = (sa.x + sb.x) / 2;
          const my = (sa.y + sb.y) / 2;
          const nx = -(sb.y - sa.y) / pxLen;
          const ny = (sb.x - sa.x) / pxLen;
          const ox = mx + nx * 12;
          const oy = my + ny * 12;

          const label = formatLen(lenMm, state.unit);
          const tw = ctx.measureText(label).width;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.strokeStyle = '#E0E3E7';
          ctx.lineWidth = 1;
          roundRectPath(ctx, ox - tw / 2 - 4, oy - 7.5, tw + 8, 15, 4);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = textColor;
          ctx.fillText(label, ox, oy + 0.5);
        }
        ctx.restore();
      }

      function drawDerivedWallsOverlay() {
        const active = getActiveFloor();
        if (!active) return;
        const fZones = state.zones.filter(z => z.floorId === active.id);
        const walls = CadEngine.computeDerivedWallsForFloor(active, fZones);
        ctx.save();
        ctx.lineCap = 'round';
        for (const w of walls) {
          const sa = worldToScreen(w.start.x, w.start.y);
          const sb = worldToScreen(w.end.x, w.end.y);
          ctx.beginPath();
          ctx.moveTo(sa.x, sa.y);
          ctx.lineTo(sb.x, sb.y);
          if (w.type === 'exterior') {
            ctx.strokeStyle = '#334155'; // 濃いスレート太線（外壁）
            ctx.lineWidth = 5;
          } else {
            ctx.strokeStyle = '#1A73E8'; // ブルーの線（内壁）
            ctx.lineWidth = 3;
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawSelectionHandles() {
        const pts = getSelectedVertices();
        if (!pts || pts.length < 3 || state.tool !== 'select') return;
        if (state.deviceMode === 'ipad' && state.ipadMode !== 'edit') return;

        ctx.save();
        // 辺の中点ハンドル（平行移動／ダブルクリックで頂点追加）
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          const mid = worldToScreen((a.x + b.x) / 2, (a.y + b.y) / 2);
          const isHover = state.hoverHandle?.kind === 'edge' && state.hoverHandle.index === i;

          ctx.save();
          ctx.translate(mid.x, mid.y);
          ctx.rotate(Math.PI / 4);
          const r = isHover ? 5.5 : 4;
          ctx.fillStyle = isHover ? '#1A73E8' : '#FFFFFF';
          ctx.strokeStyle = '#1A73E8';
          ctx.lineWidth = 1.6;
          ctx.fillRect(-r, -r, r * 2, r * 2);
          ctx.strokeRect(-r, -r, r * 2, r * 2);
          ctx.restore();
        }

        // 頂点ハンドル
        for (let i = 0; i < pts.length; i++) {
          const sp = worldToScreen(pts[i].x, pts[i].y);
          const isHover = state.hoverHandle?.kind === 'vertex' && state.hoverHandle.index === i;
          const isSelectedVert = state.selectedVertexIdx === i;

          ctx.beginPath();
          ctx.arc(sp.x, sp.y, (isHover || isSelectedVert) ? 6.5 : 5, 0, Math.PI * 2);
          ctx.fillStyle = isSelectedVert ? '#1A73E8' : (isHover ? '#E8F0FE' : '#FFFFFF');
          ctx.fill();
          ctx.strokeStyle = '#1A73E8';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.font = '600 9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
          ctx.fillStyle = '#174EA6';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'bottom';
          ctx.fillText(`#${i + 1}`, sp.x + 7, sp.y - 5);
        }
        ctx.restore();
      }

      function drawInteractiveDrafts() {
        // 矩形作図中
        if (state.drag?.kind === 'rect') {
          const p0 = state.drag.startWorld, p1 = state.drag.currWorld;
          const minX = Math.min(p0.x, p1.x), maxX = Math.max(p0.x, p1.x);
          const minY = Math.min(p0.y, p1.y), maxY = Math.max(p0.y, p1.y);
          const s0 = worldToScreen(minX, maxY), s1 = worldToScreen(maxX, minY);

          ctx.save();
          ctx.fillStyle = 'rgba(26, 115, 232, 0.10)';
          ctx.strokeStyle = '#1A73E8';
          ctx.lineWidth = 2;
          ctx.fillRect(s0.x, s0.y, s1.x - s0.x, s1.y - s0.y);
          ctx.strokeRect(s0.x, s0.y, s1.x - s0.x, s1.y - s0.y);

          const w = Math.abs(maxX - minX), d = Math.abs(maxY - minY);
          const area = (w * d) / 1_000_000;
          const sc = worldToScreen(p1.x, p1.y);
          drawWhitePillBadge(sc.x + 14, sc.y - 14, `W ${formatLen(w, state.unit)} × D ${formatLen(d, state.unit)}  (${area.toFixed(2)}㎡)`);
          ctx.restore();
        }

        // ポリゴン／敷地境界作図中
        if ((state.tool === 'polygon' || state.tool === 'site') && state.polyDraft.length > 0) {
          const isSite = state.tool === 'site';
          const strokeCol = isSite ? '#5F6368' : '#1A73E8';
          const fillCol = isSite ? 'rgba(95, 99, 104, 0.08)' : 'rgba(26, 115, 232, 0.08)';
          const curr = state.snappedCad;

          ctx.save();
          ctx.beginPath();
          state.polyDraft.forEach((p, i) => {
            const sp = worldToScreen(p.x, p.y);
            if (i === 0) ctx.moveTo(sp.x, sp.y);
            else ctx.lineTo(sp.x, sp.y);
          });
          const sCurr = worldToScreen(curr.x, curr.y);
          ctx.lineTo(sCurr.x, sCurr.y);
          if (state.polyDraft.length >= 2) {
            ctx.fillStyle = fillCol;
            ctx.fill();
          }
          ctx.strokeStyle = strokeCol;
          ctx.lineWidth = 2;
          ctx.stroke();

          if (state.polyDraft.length >= 2) {
            const sFirst = worldToScreen(state.polyDraft[0].x, state.polyDraft[0].y);
            ctx.strokeStyle = 'rgba(26, 115, 232, 0.35)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(sCurr.x, sCurr.y);
            ctx.lineTo(sFirst.x, sFirst.y);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          state.polyDraft.forEach((p, i) => {
            const sp = worldToScreen(p.x, p.y);
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, i === 0 ? 6 : 4, 0, Math.PI * 2);
            ctx.fillStyle = i === 0 ? '#188038' : '#FFFFFF';
            ctx.fill();
            ctx.strokeStyle = i === 0 ? '#188038' : strokeCol;
            ctx.lineWidth = 2;
            ctx.stroke();
          });

          const prev = state.polyDraft[state.polyDraft.length - 1];
          const dx = curr.x - prev.x, dy = curr.y - prev.y;
          const segLen = Math.hypot(dx, dy);
          let deg = Math.atan2(dy, dx) * 180 / Math.PI;
          if (deg < 0) deg += 360;
          drawWhitePillBadge(sCurr.x + 14, sCurr.y - 16, `L ${formatLen(segLen, state.unit)}  ∠${deg.toFixed(1)}°`);
          ctx.restore();
        }
      }

      function drawSnapMarker() {
        if (state.spaceDown || state.drag?.kind === 'pan') return;
        if (state.deviceMode === 'ipad' && state.ipadMode !== 'edit') return;
        const s = state.snappedCad;
        if (!s || !s.snapType) return;
        const sp = worldToScreen(s.x, s.y);

        ctx.save();
        if (s.snapType === 'vertex') {
          ctx.strokeStyle = '#188038';
          ctx.lineWidth = 2;
          ctx.strokeRect(sp.x - 6, sp.y - 6, 12, 12);
        } else if (s.snapType === 'edge') {
          ctx.strokeStyle = '#1A73E8';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(sp.x, sp.y - 6);
          ctx.lineTo(sp.x + 6, sp.y);
          ctx.lineTo(sp.x, sp.y + 6);
          ctx.lineTo(sp.x - 6, sp.y);
          ctx.closePath();
          ctx.stroke();
        } else if (s.snapType === 'grid' && state.tool !== 'select') {
          ctx.strokeStyle = 'rgba(26, 115, 232, 0.55)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, 4, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawWhitePillBadge(x, y, text) {
        ctx.save();
        ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        const tw = ctx.measureText(text).width;
        const bx = Math.min(x, canvasW - tw - 24);
        const by = Math.max(28, y);
        ctx.shadowColor = 'rgba(60, 64, 67, 0.16)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#E0E3E7';
        ctx.lineWidth = 1;
        roundRectPath(ctx, bx, by - 19, tw + 16, 24, 12);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.stroke();
        ctx.fillStyle = '#202124';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + 8, by - 7);
        ctx.restore();
      }

      function roundRectPath(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
      }

      /* =========================================================================
       * 7. PC / iPad 厳密分離操作ハンドラ & CADヒットテスト
       * ========================================================================= */
      function getCanvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      function hitTestHandles(sx, sy) {
        const pts = getSelectedVertices();
        if (!pts || pts.length < 3) return null;
        const hitR = state.deviceMode === 'ipad' ? 16 : 11;
        for (let i = 0; i < pts.length; i++) {
          const sp = worldToScreen(pts[i].x, pts[i].y);
          if (Math.hypot(sx - sp.x, sy - sp.y) <= hitR) return { kind: 'vertex', index: i };
        }
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          const mid = worldToScreen((a.x + b.x) / 2, (a.y + b.y) / 2);
          if (Math.hypot(sx - mid.x, sy - mid.y) <= hitR - 1) return { kind: 'edge', index: i };
        }
        return null;
      }

      function hitTestObject(cadPt, sx, sy) {
        const fZones = state.zones.filter(z => z.floorId === state.activeFloorId);
        for (let i = fZones.length - 1; i >= 0; i--) {
          if (CadEngine.pointInPolygon(cadPt, fZones[i].vertices)) {
            return { type: 'zone', id: fZones[i].id };
          }
        }
        if (state.siteBoundary.length >= 3) {
          for (let i = 0; i < state.siteBoundary.length; i++) {
            const a = worldToScreen(state.siteBoundary[i].x, state.siteBoundary[i].y);
            const b = worldToScreen(state.siteBoundary[(i + 1) % state.siteBoundary.length].x, state.siteBoundary[(i + 1) % state.siteBoundary.length].y);
            if (CadEngine.closestPointOnSegment({ x: sx, y: sy }, a, b).dist <= 10) {
              return { type: 'site' };
            }
          }
        }
        return null;
      }

      function nextZoneNumber() {
        const active = getActiveFloor();
        const fNum = (active?.index ?? 0) + 1;
        const count = state.zones.filter(z => z.floorId === state.activeFloorId).length + 1;
        return `Z-${fNum}${String(count).padStart(2, '0')}`;
      }

      function createNewZone(vertices) {
        const norm = CadEngine.normalizeCCW(vertices);
        if (norm.length < 3 || CadEngine.areaSqm(norm) < 0.05) {
          showToast('面積が小さすぎるため作成をキャンセルしました', 'error');
          return;
        }
        const active = getActiveFloor();
        const zone = {
          id: uid('zone'),
          zoneNumber: nextZoneNumber(),
          name: `ゾーン ${state.zones.filter(z => z.floorId === active.id).length + 1}`,
          category: 'Living',
          floorId: active.id,
          baseOffset: 0,
          height: Math.min(2500, active.height || 2600),
          vertices: norm,
          aiNotes: ''
        };
        state.zones.push(zone);
        state.selection = { type: 'zone', id: zone.id };
        state.selectedVertexIdx = -1;
        pushHistory();
        renderAll();
        showToast(`${zone.zoneNumber} を作成しました (${CadEngine.areaSqm(norm).toFixed(2)}㎡)`, 'success');
      }

      function finalizePolygonDraft() {
        if (state.polyDraft.length < 3) {
          state.polyDraft = [];
          updateDrawingHint();
          drawCanvas();
          return;
        }
        if (state.tool === 'site') {
          state.siteBoundary = CadEngine.normalizeCCW(state.polyDraft);
          state.selection = { type: 'site' };
          state.selectedVertexIdx = -1;
          state.polyDraft = [];
          pushHistory();
          setTool('select');
          renderAll();
          showToast(`敷地境界を設定しました (${CadEngine.areaSqm(state.siteBoundary).toFixed(2)}㎡)`, 'success');
        } else {
          const pts = [...state.polyDraft];
          state.polyDraft = [];
          updateDrawingHint();
          createNewZone(pts);
        }
      }

      // ===== トラックパッド ピンチ対応 =====
      // Safari(Mac)はピンチを wheel ではなく gesture* イベントで送る。Chrome/Firefox/Edgeは ctrlKey 付き wheel。
      // 両方に対応し、ブラウザ標準のページ拡大も抑止する。
      let safariGesture = null;
      canvas.addEventListener('gesturestart', (e) => {
        e.preventDefault();
        if (state.deviceMode === 'ipad') return;
        safariGesture = { origView: { ...state.view } };
      }, { passive: false });
      canvas.addEventListener('gesturechange', (e) => {
        e.preventDefault();
        if (state.deviceMode === 'ipad' || !safariGesture) return;
        const pt = getCanvasPoint(e);
        state.view = CadEngine.zoomAtScreenPoint(safariGesture.origView, pt.x, pt.y, safariGesture.origView.scale * e.scale);
        syncZoomUI();
        drawCanvas();
        updateCoordReadout(pt);
      }, { passive: false });
      canvas.addEventListener('gestureend', (e) => { e.preventDefault(); safariGesture = null; }, { passive: false });
      // キャンバス外でのブラウザ標準ズーム（Ctrl+ホイール/ピンチ）も抑止
      document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, (e) => e.preventDefault(), { passive: false }));

      function normalizeWheel(e) {
        const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
        return { dx: e.deltaX * k, dy: e.deltaY * k };
      }

      // PCモード：2本指スライド=パン、ピンチ(ctrlKey)=カーソル中心ズーム
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const { dx, dy } = normalizeWheel(e);
        const isPinch = e.ctrlKey || e.metaKey;
        const zoomBy = () => {
          const pt = getCanvasPoint(e);
          const factor = Math.exp(-Math.max(-100, Math.min(100, dy)) * (e.ctrlKey ? 0.015 : 0.005));
          state.view = CadEngine.zoomAtScreenPoint(state.view, pt.x, pt.y, state.view.scale * factor);
          syncZoomUI();
          drawCanvas();
          updateCoordReadout(pt);
        };
        if (state.deviceMode === 'ipad') {
          if (state.ipadMode === 'pan' && !isPinch) {
            state.view.panX -= dx; state.view.panY -= dy; drawCanvas();
          } else if (state.ipadMode === 'zoom' && isPinch) {
            zoomBy();
          }
          return;
        }
        if (isPinch) {
          zoomBy();
        } else {
          state.view.panX -= dx; state.view.panY -= dy; drawCanvas();
          updateCoordReadout(getCanvasPoint(e));
        }
      }, { passive: false });

      // Pointer Events（PC + iPad 統合ハンドリング）
      canvas.addEventListener('pointerdown', (e) => {
        closeAllPopovers();
        canvas.setPointerCapture(e.pointerId);
        const pt = getCanvasPoint(e);
        state.activePointers.set(e.pointerId, pt);

        // === iPadモードの厳密分離 ===
        if (state.deviceMode === 'ipad') {
          if (state.ipadMode === 'pan') {
            // 移動のみ許可（1本指でも2本指でもパンのみ、ズームは絶対発動しない）
            const pts = Array.from(state.activePointers.values());
            const center = pts.length >= 2
              ? { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }
              : pts[0];
            state.ipadGesture = {
              kind: 'pan',
              startX: center.x, startY: center.y,
              origPanX: state.view.panX, origPanY: state.view.panY
            };
            return;
          }
          if (state.ipadMode === 'zoom') {
            // 拡大縮小のみ許可（パン成分は完全無効化）
            const pts = Array.from(state.activePointers.values());
            if (pts.length >= 2) {
              const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
              const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
              state.ipadGesture = {
                kind: 'pinchZoom',
                startDist: dist,
                anchorX: mid.x, anchorY: mid.y,
                origView: { ...state.view }
              };
            } else {
              // 1本指の上下ドラッグで画面中央基準の純粋拡大縮小
              state.ipadGesture = {
                kind: 'dragZoom',
                startY: pt.y,
                origView: { ...state.view }
              };
            }
            return;
          }
          // iPad 'edit' モード：2本目以降のタッチが来たら誤爆パン/ズームを完全にブロック
          if (state.activePointers.size > 1) {
            state.drag = null;
            return;
          }
        }

        // === PC補助パン（中ボタン または Space+左ドラッグ） ===
        if (state.deviceMode === 'pc' && (e.button === 1 || (state.spaceDown && e.button === 0))) {
          state.drag = {
            kind: 'pan',
            startSx: pt.x, startSy: pt.y,
            origPanX: state.view.panX, origPanY: state.view.panY
          };
          canvasContainer.style.cursor = 'grabbing';
          return;
        }

        if (e.button !== 0 && e.pointerType === 'mouse') return;

        // === CAD作図・選択・編集（PC通常時 または iPad編集/作図モード時） ===
        const rawWorld = screenToWorld(pt.x, pt.y);

        if (state.tool === 'rect') {
          const snapped = computeSnap(rawWorld);
          state.drag = { kind: 'rect', startWorld: snapped, currWorld: snapped };
          drawCanvas();
          return;
        }

        if (state.tool === 'polygon' || state.tool === 'site') {
          const anchor = state.polyDraft.length > 0 ? state.polyDraft[state.polyDraft.length - 1] : null;
          const snapped = computeSnap(rawWorld, { angleAnchor: anchor });

          if (state.polyDraft.length >= 3) {
            const firstS = worldToScreen(state.polyDraft[0].x, state.polyDraft[0].y);
            if (Math.hypot(pt.x - firstS.x, pt.y - firstS.y) <= (state.deviceMode === 'ipad' ? 20 : 14)) {
              finalizePolygonDraft();
              return;
            }
          }
          if (anchor && Math.hypot(snapped.x - anchor.x, snapped.y - anchor.y) < 1) return;
          state.polyDraft.push({ x: snapped.x, y: snapped.y });
          updateDrawingHint();
          drawCanvas();
          return;
        }

        if (state.tool === 'select') {
          const handle = hitTestHandles(pt.x, pt.y);
          if (handle) {
            const pts = getSelectedVertices();
            const origPts = pts.map(p => ({ ...p }));
            if (handle.kind === 'vertex') {
              state.selectedVertexIdx = handle.index;
              state.drag = {
                kind: 'moveVertex',
                index: handle.index,
                origPts,
                origVertex: { ...pts[handle.index] },
                changed: false
              };
            } else {
              state.selectedVertexIdx = -1;
              const i0 = handle.index;
              const i1 = (i0 + 1) % pts.length;
              const a = pts[i0], b = pts[i1];
              const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
              state.drag = {
                kind: 'moveEdge',
                i0, i1,
                nx: -(b.y - a.y) / len,
                ny: (b.x - a.x) / len,
                startWorld: rawWorld,
                origPts,
                changed: false
              };
            }
            updateSelectionButtons();
            drawCanvas();
            return;
          }

          const hit = hitTestObject(rawWorld, pt.x, pt.y);
          state.selection = hit;
          state.selectedVertexIdx = -1;
          if (hit) {
            const pts = getSelectedVertices();
            state.drag = {
              kind: 'moveObject',
              startWorld: rawWorld,
              origPts: pts.map(p => ({ ...p })),
              refCorner: { ...pts[0] },
              changed: false
            };
          }
          renderInspector();
          updateSelectionButtons();
          drawCanvas();
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        const pt = getCanvasPoint(e);
